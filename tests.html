<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | الاختبارات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        #020202;

    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;
}

.grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    mask-image:
        radial-gradient(
            circle,
            black,
            transparent 90%
        );
}

.glow{
    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);

    filter:blur(130px);
}

.glow.one{
    top:-220px;
    right:-120px;
}

.glow.two{
    bottom:-250px;
    left:-140px;
}


/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;

    width:100%;

    padding:
        17px 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        rgba(2,2,2,.78);

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    backdrop-filter:blur(18px);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:43px;
    height:43px;

    border-radius:13px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #fff,
            #777
        );

    border:
        1px solid
        rgba(255,255,255,.15);
}

.brand-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.brand-text h2{
    font-size:14px;
}

.brand-text span{
    display:block;

    margin-top:3px;

    color:#555;

    font-size:7px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    height:37px;

    padding:
        0 13px;

    border-radius:10px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.025);

    color:#777;

    cursor:pointer;

    font-size:8px;

    transition:.25s;
}

.header-btn:hover{
    color:#fff;

    border-color:
        rgba(255,255,255,.18);
}


/* =========================
   MAIN
========================= */

.container{
    width:min(
        1180px,
        calc(100% - 30px)
    );

    margin:
        35px auto 70px;
}


/* =========================
   HERO
========================= */

.hero{

    padding:
        30px;

    border-radius:25px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    margin-bottom:20px;
}

.hero-small{
    color:#555;
    font-size:9px;
    margin-bottom:8px;
}

.hero h1{
    font-size:
        clamp(
            25px,
            5vw,
            38px
        );

    margin-bottom:10px;
}

.hero p{
    color:#606060;
    font-size:10px;
}


/* =========================
   SEARCH
========================= */

.tools{

    display:flex;

    gap:10px;

    margin-bottom:25px;

}

.search-box{

    position:relative;

    flex:1;
}

.search-box input{

    width:100%;

    height:45px;

    padding:
        0 15px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.025);

    color:#fff;

    outline:none;

    font-size:9px;
}

.search-box input::placeholder{
    color:#444;
}

.search-box input:focus{

    border-color:
        rgba(255,255,255,.2);
}

.refresh{

    height:45px;

    padding:
        0 17px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.025);

    color:#777;

    cursor:pointer;

    font-size:9px;

    transition:.25s;
}

.refresh:hover{
    color:#fff;
}


/* =========================
   SECTION
========================= */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}

.section-title h2{
    font-size:16px;
}

.count{
    color:#4e4e4e;
    font-size:8px;
}


/* =========================
   EXAMS
========================= */

.exams{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                260px,
                1fr
            )
        );

    gap:15px;
}

.exam-card{

    padding:21px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );

    transition:
        .25s ease;

    animation:
        cardIn .4s ease both;
}

.exam-card:hover{

    transform:
        translateY(-4px);

    border-color:
        rgba(255,255,255,.14);
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            translateY(10px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }

}

.exam-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:17px;
}

.exam-icon{

    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.07);

    font-size:17px;
}

.status{

    padding:
        6px 9px;

    border-radius:8px;

    color:#888;

    background:
        rgba(255,255,255,.035);

    font-size:7px;
}

.exam-card h3{

    font-size:13px;

    margin-bottom:8px;
}

.description{

    min-height:35px;

    color:#555;

    font-size:8px;

    line-height:1.8;

    margin-bottom:17px;
}

.info-row{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-bottom:18px;
}

.info{

    padding:
        6px 8px;

    border-radius:8px;

    background:
        rgba(255,255,255,.025);

    color:#666;

    font-size:7px;
}

.start{

    width:100%;

    height:41px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #aaa
        );

    color:#080808;

    cursor:pointer;

    font-size:9px;

    font-weight:bold;

    transition:.25s;
}

.start:hover{

    transform:
        translateY(-2px);
}


/* =========================
   EMPTY
========================= */

.empty{

    grid-column:
        1 / -1;

    padding:
        65px 20px;

    text-align:center;

    border-radius:20px;

    border:
        1px dashed
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.012);
}

.empty-icon{

    font-size:32px;

    opacity:.3;

    margin-bottom:12px;
}

.empty h3{

    color:#777;

    font-size:12px;

    margin-bottom:7px;
}

.empty p{

    color:#444;

    font-size:8px;
}


/* =========================
   LOADING
========================= */

.loading{

    grid-column:
        1 / -1;

    padding:60px;

    text-align:center;

    color:#555;

    font-size:9px;
}

.loader{

    width:27px;
    height:27px;

    margin:
        0 auto 12px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.08);

    border-top-color:#aaa;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:
            rotate(360deg);
    }

}


/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    bottom:25px;

    left:50%;

    transform:
        translateX(-50%)
        translateY(100px);

    opacity:0;

    padding:
        12px 18px;

    border-radius:12px;

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.1);

    color:#aaa;

    font-size:8px;

    transition:.3s;

    z-index:500;
}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    header{
        padding:
            14px 15px;
    }

    .brand-text{
        display:none;
    }

    .container{

        width:
            calc(100% - 20px);

        margin-top:20px;
    }

    .hero{
        padding:23px;
    }

    .tools{
        flex-direction:column;
    }

    .refresh{
        width:100%;
    }

}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="background">

    <div class="grid"></div>

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>


<!-- HEADER -->

<header>


    <div class="brand">

        <div class="brand-logo">

            <img
                src="teacher.png"
                alt="الخوارزمي"
            >

        </div>


        <div class="brand-text">

            <h2>
                الخوارزمي
            </h2>

            <span>
                منصة الاختبارات
            </span>

        </div>

    </div>


    <div class="header-actions">

        <button
            class="header-btn"
            onclick="
                window.location.href='home.html'
            "
        >
            الرئيسية
        </button>

    </div>


</header>


<!-- MAIN -->

<main class="container">


    <!-- HERO -->

    <section class="hero">

        <div class="hero-small">
            منصة الاختبارات
        </div>

        <h1>
            اختر اختبارك
        </h1>

        <p>
            جميع الاختبارات المنشورة متاحة هنا للبدء.
        </p>

    </section>


    <!-- TOOLS -->

    <div class="tools">

        <div class="search-box">

            <input
                id="searchInput"
                type="search"
                placeholder="ابحث عن اختبار..."
                autocomplete="off"
            >

        </div>


        <button
            class="refresh"
            id="refreshBtn"
        >
            ↻ تحديث
        </button>

    </div>


    <!-- TITLE -->

    <div class="section-title">

        <h2>
            الاختبارات المتاحة
        </h2>

        <span
            class="count"
            id="examCount"
        >
            —
        </span>

    </div>


    <!-- EXAMS -->

    <div
        id="examsContainer"
        class="exams"
    >

        <div class="loading">

            <div class="loader"></div>

            جاري تحميل الاختبارات...

        </div>

    </div>


</main>


<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://cuygojzrgpposlcpthjw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ySp8SmV4CDZaOojNnkNMPA_5S5s_Ia5";


const {
    createClient
} = window.supabase;


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const examsContainer =
    document.getElementById(
        "examsContainer"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const examCount =
    document.getElementById(
        "examCount"
    );

const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );

const toast =
    document.getElementById(
        "toast"
    );


let allExams = [];


/* =========================================
   TOAST
========================================= */

function showToast(
    text
){

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   DATE
========================================= */

function formatDate(
    value
){

    if(!value){

        return "";

    }


    try{

        return new Date(
            value
        ).toLocaleDateString(
            "ar-EG",
            {
                year:"numeric",
                month:"short",
                day:"numeric"
            }
        );

    }catch{

        return "";

    }

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession(){

    const {
        data,
        error
    } =
        await supabase.auth
        .getSession();


    if(error){

        console.error(
            error
        );

        window.location.href =
            "auth.html";

        return false;

    }


    if(
        !data ||
        !data.session
    ){

        window.location.href =
            "auth.html";

        return false;

    }


    return true;

}


/* =========================================
   LOAD EXAMS
========================================= */

async function loadExams(){

    examsContainer.innerHTML = `

        <div class="loading">

            <div class="loader"></div>

            جاري تحميل الاختبارات...

        </div>

    `;


    const {
        data,
        error
    } =
        await supabase
        .from("exams")
        .select("*")
        .eq(
            "active",
            true
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            error
        );

        examsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠
                </div>

                <h3>
                    تعذر تحميل الاختبارات
                </h3>

                <p>
                    حدث خطأ أثناء الاتصال بقاعدة البيانات.
                </p>

            </div>

        `;

        examCount.textContent =
            "0 اختبار";

        return;

    }


    allExams =
        data || [];


    renderExams(
        allExams
    );

}


/* =========================================
   RENDER
========================================= */

function renderExams(
    exams
){

    examCount.textContent =
        exams.length +
        (
            exams.length === 1
            ? " اختبار"
            : " اختبارات"
        );


    if(
        exams.length === 0
    ){

        examsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ◌
                </div>

                <h3>
                    لا توجد اختبارات
                </h3>

                <p>
                    لا توجد اختبارات منشورة حاليًا.
                </p>

            </div>

        `;

        return;

    }


    examsContainer.innerHTML =
        exams
        .map(
            (
                exam,
                index
            ) => {

                return createExamCard(
                    exam,
                    index
                );

            }
        )
        .join("");

}


/* =========================================
   CREATE CARD
========================================= */

function createExamCard(
    exam,
    index
){

    const title =
        escapeHTML(
            exam.title ||
            "اختبار"
        );


    const description =
        escapeHTML(
            exam.description ||
            "اختبار إلكتروني من منصة الخوارزمي."
        );


    const duration =
        exam.duration ||
        exam.time_limit ||
        null;


    const questions =
        exam.questions_count ||
        exam.question_count ||
        null;


    const date =
        formatDate(
            exam.created_at
        );


    return `

        <article
            class="exam-card"
            style="
                animation-delay:
                ${index * 60}ms
            "
        >

            <div class="exam-top">

                <div class="exam-icon">
                    📝
                </div>

                <div class="status">
                    متاح الآن
                </div>

            </div>


            <h3>
                ${title}
            </h3>


            <div class="description">

                ${description}

            </div>


            <div class="info-row">


                ${
                    duration
                    ?
                    `
                    <div class="info">
                        ⏱
                        ${escapeHTML(duration)}
                        دقيقة
                    </div>
                    `
                    :
                    `
                    <div class="info">
                        ⏱
                        بدون وقت محدد
                    </div>
                    `
                }


                ${
                    questions
                    ?
                    `
                    <div class="info">
                        ❓
                        ${escapeHTML(questions)}
                        سؤال
                    </div>
                    `
                    :
                    ""
                }


                ${
                    date
                    ?
                    `
                    <div class="info">
                        📅
                        ${date}
                    </div>
                    `
                    :
                    ""
                }


            </div>


            <button
                class="start"
                onclick="
                    startExam(
                        '${exam.id}'
                    )
                "
            >
                بدء الاختبار
            </button>


        </article>

    `;

}


/* =========================================
   START EXAM
========================================= */

function startExam(
    examId
){

    if(!examId){

        showToast(
            "معرف الاختبار غير موجود."
        );

        return;

    }


    window.location.href =
        "exam.html?id=" +
        encodeURIComponent(
            examId
        );

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
    "input",
    function(){

        const query =
            this.value
            .trim()
            .toLowerCase();


        if(!query){

            renderExams(
                allExams
            );

            return;

        }


        const filtered =
            allExams.filter(
                exam => {

                    const title =
                        String(
                            exam.title ||
                            ""
                        )
                        .toLowerCase();


                    const description =
                        String(
                            exam.description ||
                            ""
                        )
                        .toLowerCase();


                    return (
                        title.includes(
                            query
                        )
                        ||
                        description.includes(
                            query
                        )
                    );

                }
            );


        renderExams(
            filtered
        );

    }
);


/* =========================================
   REFRESH
========================================= */

refreshBtn.addEventListener(
    "click",
    async function(){

        refreshBtn.disabled =
            true;

        refreshBtn.textContent =
            "جاري التحديث...";


        await loadExams();


        refreshBtn.disabled =
            false;

        refreshBtn.textContent =
            "↻ تحديث";

        showToast(
            "تم تحديث الاختبارات."
        );

    }
);


/* =========================================
   AUTH STATE
========================================= */

supabase.auth.onAuthStateChange(
    (
        event,
        session
    ) => {

        if(
            event ===
            "SIGNED_OUT"
        ){

            window.location.href =
                "auth.html";

        }

    }
);


/* =========================================
   START
========================================= */

(async function(){

    const logged =
        await checkSession();


    if(
        logged
    ){

        await loadExams();

    }

})();

</script>

</body>

</html>
