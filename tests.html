<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الخوارزمي | الاختبارات</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;
            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(255,255,255,.08),
                    transparent 35%
                ),
                #020202;
            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: -5;
            pointer-events: none;
        }

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.015) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.015) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;
        }

        .glow {
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.035);

            filter: blur(110px);
        }

        .glow.one {
            top: -250px;
            right: -150px;
        }

        .glow.two {
            bottom: -250px;
            left: -150px;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            width: min(
                1180px,
                calc(100% - 32px)
            );

            height: 76px;

            margin: 18px auto;

            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                rgba(9,9,9,.84);

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius: 20px;

            backdrop-filter: blur(20px);

            position: relative;
            z-index: 10;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;

            color: white;
            text-decoration: none;
        }

        .logo-icon {
            width: 46px;
            height: 46px;

            overflow: hidden;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    #fff,
                    #888
                );

            animation:
                logoFloat 3.5s ease-in-out infinite;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-4px)
                    rotate(2deg);
            }

        }

        .logo-text strong {
            display: block;
            font-size: 17px;
        }

        .logo-text span {
            display: block;

            color: #666;

            font-size: 10px;

            margin-top: 3px;
        }

        /* =========================
           NAV
        ========================= */

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: #777;

            text-decoration: none;

            font-size: 12px;

            transition: .3s;
        }

        nav a:hover,
        nav a.active {
            color: white;
        }

        /* =========================
           USER
        ========================= */

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-name {
            color: #aaa;
            font-size: 11px;
        }

        .logout {
            padding: 10px 15px;

            border-radius: 11px;

            text-decoration: none;

            color: #050505;

            background:
                linear-gradient(
                    135deg,
                    white,
                    #aaa
                );

            font-size: 11px;

            font-weight: bold;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: min(
                1180px,
                calc(100% - 32px)
            );

            margin: auto;

            padding: 50px 0 80px;
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            text-align: center;

            margin-bottom: 40px;
        }

        .page-title .badge {
            display: inline-block;

            padding: 8px 14px;

            margin-bottom: 15px;

            border-radius: 50px;

            color: #aaa;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.08);

            font-size: 10px;
        }

        .page-title h1 {
            font-size:
                clamp(32px, 5vw, 52px);

            margin-bottom: 12px;
        }

        .page-title h1 span {
            background:
                linear-gradient(
                    90deg,
                    white,
                    #888
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .page-title p {
            color: #666;

            font-size: 13px;

            line-height: 1.9;
        }

        /* =========================
           FILTER BAR
        ========================= */

        .toolbar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 25px;

            padding: 15px;

            border-radius: 18px;

            background:
                rgba(255,255,255,.025);

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        .search {
            flex: 1;

            max-width: 420px;

            height: 43px;

            padding: 0 15px;

            border-radius: 11px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(255,255,255,.035);

            color: white;

            font-size: 11px;
        }

        .search::placeholder {
            color: #555;
        }

        .count {
            color: #777;

            font-size: 10px;

            white-space: nowrap;
        }

        /* =========================
           TESTS GRID
        ========================= */

        .tests-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }

        /* =========================
           TEST CARD
        ========================= */

        .test-card {
            position: relative;

            padding: 25px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.065),
                    rgba(255,255,255,.018)
                );

            border:
                1px solid
                rgba(255,255,255,.09);

            transition: .35s;

            overflow: hidden;
        }

        .test-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -100px;
            left: -90px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.025);

            filter: blur(30px);
        }

        .test-card:hover {
            transform:
                translateY(-7px);

            border-color:
                rgba(255,255,255,.18);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.45);
        }

        .test-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;
        }

        .test-logo {
            width: 48px;
            height: 48px;

            border-radius: 14px;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    white,
                    #777
                );
        }

        .test-logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .status {
            padding: 7px 10px;

            border-radius: 20px;

            border:
                1px solid
                rgba(255,255,255,.07);

            color: #888;

            font-size: 9px;
        }

        .test-card h2 {
            font-size: 18px;

            margin-bottom: 10px;
        }

        .test-description {
            color: #666;

            font-size: 11px;

            line-height: 1.9;

            min-height: 42px;
        }

        .test-details {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin: 20px 0;
        }

        .detail {
            padding: 11px;

            border-radius: 11px;

            background:
                rgba(255,255,255,.025);

            border:
                1px solid
                rgba(255,255,255,.05);

            text-align: center;
        }

        .detail strong {
            display: block;

            color: #bbb;

            font-size: 13px;

            margin-bottom: 4px;
        }

        .detail span {
            color: #555;

            font-size: 8px;
        }

        .start-btn {
            width: 100%;

            display: block;

            padding: 13px;

            text-align: center;

            text-decoration: none;

            color: #050505;

            background:
                linear-gradient(
                    135deg,
                    white,
                    #aaa
                );

            border-radius: 12px;

            font-size: 11px;

            font-weight: bold;

            transition: .3s;
        }

        .start-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 15px 35px
                rgba(255,255,255,.1);
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty {
            grid-column: 1 / -1;

            min-height: 280px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;

            border-radius: 24px;

            border:
                1px dashed
                rgba(255,255,255,.10);

            background:
                rgba(255,255,255,.018);

            color: #555;
        }

        .empty-logo {
            width: 70px;
            height: 70px;

            overflow: hidden;

            border-radius: 20px;

            margin-bottom: 18px;

            opacity: .45;

            animation:
                emptyFloat 3s ease-in-out infinite;
        }

        .empty-logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        @keyframes emptyFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-7px);
            }

        }

        .empty strong {
            color: #777;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .empty span {
            font-size: 10px;

            color: #444;

            line-height: 1.8;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            width: min(
                1180px,
                calc(100% - 32px)
            );

            margin: auto;

            padding: 25px 0;

            border-top:
                1px solid
                rgba(255,255,255,.06);

            text-align: center;

            color: #555;

            font-size: 10px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            nav {
                display: none;
            }

            .tests-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            header {
                width:
                    calc(100% - 20px);

                margin-top: 10px;

                height: 68px;

                padding: 0 13px;
            }

            .logo-icon {
                width: 40px;
                height: 40px;
            }

            .logo-text strong {
                font-size: 15px;
            }

            .user-name {
                display: none;
            }

            main {
                width:
                    calc(100% - 20px);

                padding-top: 30px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                max-width: none;
                width: 100%;
            }

            .count {
                text-align: center;
            }

            .tests-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

    <div class="grid"></div>

</div>


<!-- =========================
     HEADER
========================= -->

<header>

    <a
        href="home.html"
        class="logo"
    >

        <div class="logo-icon">

            <img
                src="teacher.png"
                alt="الماستر"
            >

        </div>

        <div class="logo-text">

            <strong>
                الخوارزمي
            </strong>

            <span>
                منصة الاختبارات
            </span>

        </div>

    </a>


    <nav>

        <a href="home.html">
            الرئيسية
        </a>

        <a
            href="tests.html"
            class="active"
        >
            الاختبارات
        </a>

        <a href="#">
            النتائج
        </a>

        <a href="#">
            حسابي
        </a>

    </nav>


    <div class="user-area">

        <span
            class="user-name"
            id="userName"
        >
            الطالب
        </span>

        <a
            href="index.html"
            class="logout"
            onclick="logout()"
        >
            خروج
        </a>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>


    <!-- PAGE TITLE -->

    <section class="page-title">

        <div class="badge">
            الاختبارات الإلكترونية
        </div>

        <h1>
            اختبارات
            <span>
                الخوارزمي
            </span>
        </h1>

        <p>
            اختر الاختبار المناسب لك وابدأ
            تجربتك التعليمية.
        </p>

    </section>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <input
            type="search"
            id="searchInput"
            class="search"
            placeholder="ابحث عن اختبار..."
        >

        <div class="count">
            عدد الاختبارات:
            <strong id="testCount">0</strong>
        </div>

    </div>


    <!-- TESTS -->

    <section
        class="tests-grid"
        id="testsGrid"
    >

        <!-- يتم إنشاء الاختبارات هنا -->

    </section>


</main>


<footer>

    © 2026 الخوارزمي | منصة الاختبارات

</footer>


<script>

    /* =========================
       USER
    ========================= */

    const userName =
        localStorage.getItem("userName");


    if (userName) {

        document.getElementById(
            "userName"
        ).textContent = userName;

    }


    function logout() {

        localStorage.removeItem(
            "userName"
        );

    }


    /* =========================
       LOAD TESTS
    ========================= */

    let tests = [];

    try {

        tests =
            JSON.parse(
                localStorage.getItem("tests") || "[]"
            );

    } catch {

        tests = [];

    }


    const grid =
        document.getElementById(
            "testsGrid"
        );

    const count =
        document.getElementById(
            "testCount"
        );

    const search =
        document.getElementById(
            "searchInput"
        );


    function renderTests(list) {

        grid.innerHTML = "";

        count.textContent =
            list.length;


        /* لا توجد اختبارات */

        if (list.length === 0) {

            grid.innerHTML = `

                <div class="empty">

                    <div class="empty-logo">

                        <img
                            src="teacher.png"
                            alt="الماستر"
                        >

                    </div>

                    <strong>
                        لا توجد اختبارات متاحة حاليًا
                    </strong>

                    <span>
                        سيتم عرض الاختبارات هنا
                        عندما يقوم المسؤول بإضافتها.
                    </span>

                </div>

            `;

            return;

        }


        /* عرض الاختبارات */

        list.forEach(function(test, index) {

            const id =
                test.id ||
                index + 1;


            const title =
                test.title ||
                "اختبار";


            const description =
                test.description ||
                "اختبار إلكتروني.";


            const questions =
                test.questions ||
                0;


            const duration =
                test.duration ||
                0;


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "test-card";


            card.innerHTML = `

                <div class="test-header">

                    <div class="test-logo">

                        <img
                            src="teacher.png"
                            alt="الماستر"
                        >

                    </div>

                    <span class="status">
                        متاح
                    </span>

                </div>


                <h2>
                    ${escapeHTML(title)}
                </h2>


                <p class="test-description">
                    ${escapeHTML(description)}
                </p>


                <div class="test-details">

                    <div class="detail">

                        <strong>
                            ${questions}
                        </strong>

                        <span>
                            سؤال
                        </span>

                    </div>


                    <div class="detail">

                        <strong>
                            ${duration}
                        </strong>

                        <span>
                            دقيقة
                        </span>

                    </div>

                </div>


                <a
                    class="start-btn"
                    href="exam.html?id=${encodeURIComponent(id)}"
                >
                    بدء الاختبار
                </a>

            `;


            grid.appendChild(card);

        });

    }


    /* =========================
       SEARCH
    ========================= */

    search.addEventListener(
        "input",
        function() {

            const value =
                this.value
                .trim()
                .toLowerCase();


            if (!value) {

                renderTests(tests);

                return;

            }


            const filtered =
                tests.filter(
                    function(test) {

                        return (
                            String(
                                test.title || ""
                            )
                            .toLowerCase()
                            .includes(value)
                        );

                    }
                );


            renderTests(filtered);

        }
    );


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    /* =========================
       INITIAL
    ========================= */

    renderTests(tests);

</script>


</body>

</html>
