<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | الحساب</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}


/* =====================================================
   BODY
===================================================== */

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.13),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(255,255,255,.04),
            transparent 35%
        ),
        #020202;

    overflow-x:hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    pointer-events:none;
}

.grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:55px 55px;
}


/* =====================================================
   CARD
===================================================== */

.card{

    width:min(470px,100%);

    padding:30px 24px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(25,25,25,.97),
            rgba(5,5,5,.97)
        );

    border:1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 35px 120px rgba(0,0,0,.85),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter:blur(25px);

    overflow:hidden;

    animation:cardIn .6s ease;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(20px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:76px;
    height:76px;

    margin:0 auto 16px;

    border-radius:23px;

    overflow:hidden;

    background:#fff;

    border:1px solid
        rgba(255,255,255,.15);

    animation:floating 3.5s ease-in-out infinite;
}

.logo img{

    width:100%;
    height:100%;

    object-fit:cover;
}

@keyframes floating{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }

}


/* =====================================================
   TITLE
===================================================== */

h1{

    text-align:center;

    font-size:23px;

    margin-bottom:7px;
}

.subtitle{

    text-align:center;

    color:#606060;

    font-size:9px;

    margin-bottom:25px;
}


/* =====================================================
   TABS
===================================================== */

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:5px;

    padding:4px;

    margin-bottom:23px;

    border-radius:14px;

    background:#101010;

    border:1px solid
        rgba(255,255,255,.04);
}

.tab{

    height:43px;

    border:0;

    border-radius:10px;

    background:transparent;

    color:#555;

    cursor:pointer;

    font-size:10px;

    transition:.25s ease;
}

.tab:hover{

    color:#aaa;

}

.tab.active{

    color:#080808;

    background:
        linear-gradient(
            135deg,
            #fff,
            #aaa
        );

    box-shadow:
        0 6px 20px
        rgba(255,255,255,.06);
}


/* =====================================================
   FORMS
===================================================== */

.form{

    width:100%;

    display:none;

    opacity:0;
}

.form.active{

    display:block;

    animation:
        showForm
        .38s
        ease
        forwards;
}

@keyframes showForm{

    from{
        opacity:0;
        transform:
            translateY(12px)
            scale(.985);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   FIELD
===================================================== */

.field{

    margin-bottom:13px;
}

label{

    display:block;

    color:#707070;

    font-size:9px;

    margin-bottom:7px;
}

input{

    width:100%;

    height:47px;

    padding:0 14px;

    border-radius:13px;

    border:1px solid
        rgba(255,255,255,.08);

    background:#0d0d0d;

    color:#fff;

    outline:none;

    font-size:10px;

    transition:.25s ease;
}

input::placeholder{

    color:#3f3f3f;
}

input:focus{

    border-color:
        rgba(255,255,255,.28);

    background:#111;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.025);
}


/* =====================================================
   PASSWORD
===================================================== */

.password-box{

    position:relative;
}

.password-box input{

    padding-left:48px;
}

.password-toggle{

    position:absolute;

    left:12px;
    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#555;

    cursor:pointer;

    font-size:12px;
}

.password-toggle:hover{

    color:#aaa;
}


/* =====================================================
   MAIN BUTTON
===================================================== */

.main-btn{

    width:100%;

    height:49px;

    margin-top:5px;

    border:0;

    border-radius:14px;

    cursor:pointer;

    color:#080808;

    font-weight:bold;

    font-size:10px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #aaa
        );

    box-shadow:
        0 10px 30px
        rgba(255,255,255,.04);

    transition:.25s ease;
}

.main-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 15px 35px
        rgba(255,255,255,.08);
}

.main-btn:active{

    transform:translateY(0);
}

.main-btn:disabled{

    opacity:.45;

    cursor:not-allowed;

    transform:none;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    min-height:22px;

    margin-top:13px;

    text-align:center;

    font-size:9px;

    line-height:1.8;
}

.message.success{

    color:#cfcfcf;
}

.message.error{

    color:#ff8b8b;
}


/* =====================================================
   AFTER REGISTER
===================================================== */

.after-register{

    display:none;

    margin-top:12px;
}

.after-register.show{

    display:block;

    animation:
        showForm
        .35s
        ease;
}

.after-register button{

    width:100%;

    height:43px;

    border-radius:13px;

    border:1px solid
        rgba(255,255,255,.1);

    background:#111;

    color:#ddd;

    cursor:pointer;

    font-size:10px;

    transition:.2s;
}

.after-register button:hover{

    background:#181818;

    color:#fff;
}


/* =====================================================
   FOOTER
===================================================== */

.note{

    text-align:center;

    color:#414141;

    font-size:8px;

    line-height:1.8;

    margin-top:18px;
}

.back{

    display:block;

    margin-top:15px;

    text-align:center;

    color:#555;

    text-decoration:none;

    font-size:9px;

    transition:.2s;
}

.back:hover{

    color:#aaa;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

    body{

        align-items:flex-start;

        padding-top:25px;
    }

    .card{

        padding:25px 17px;

        border-radius:25px;
    }

    h1{

        font-size:21px;
    }

    .logo{

        width:70px;
        height:70px;
    }

}

</style>

</head>


<body>


<div class="background">

    <div class="grid"></div>

</div>


<div class="card">


    <!-- LOGO -->

    <div class="logo">

        <img
            src="teacher.png"
            alt="الخوارزمي"
        >

    </div>


    <h1>
        الخوارزمي
    </h1>


    <div class="subtitle">
        منصة الاختبارات الإلكترونية
    </div>


    <!-- =================================================
         TABS
    ================================================== -->

    <div class="tabs">

        <button
            type="button"
            id="registerTab"
            class="tab active"
        >
            إنشاء حساب
        </button>


        <button
            type="button"
            id="loginTab"
            class="tab"
        >
            تسجيل الدخول
        </button>

    </div>


    <!-- =================================================
         REGISTER FORM
    ================================================== -->

    <form
        id="registerForm"
        class="form active"
        autocomplete="on"
    >


        <div class="field">

            <label>
                الاسم الكامل
            </label>

            <input
                id="registerName"
                type="text"
                placeholder="اكتب اسمك بالكامل"
                autocomplete="name"
                required
            >

        </div>


        <div class="field">

            <label>
                البريد الإلكتروني
            </label>

            <input
                id="registerEmail"
                type="email"
                placeholder="example@email.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="field">

            <label>
                رقم الهاتف
            </label>

            <input
                id="registerPhone"
                type="tel"
                inputmode="tel"
                placeholder="01xxxxxxxxx"
                autocomplete="tel"
                required
            >

        </div>


        <div class="field">

            <label>
                رقم هاتف ولي الأمر
            </label>

            <input
                id="parentPhone"
                type="tel"
                inputmode="tel"
                placeholder="01xxxxxxxxx"
                autocomplete="tel"
                required
            >

        </div>


        <div class="field">

            <label>
                كلمة المرور
            </label>

            <div class="password-box">

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="6 أحرف أو أكثر"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="registerPassword"
                >
                    ◉
                </button>

            </div>

        </div>


        <div class="field">

            <label>
                تأكيد كلمة المرور
            </label>

            <div class="password-box">

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="confirmPassword"
                >
                    ◉
                </button>

            </div>

        </div>


        <button
            id="registerButton"
            class="main-btn"
            type="submit"
        >
            إنشاء الحساب
        </button>


        <div
            id="registerMessage"
            class="message"
        ></div>


        <div
            id="afterRegister"
            class="after-register"
        >

            <button
                type="button"
                id="goToLogin"
            >
                تم إنشاء الحساب — تسجيل الدخول
            </button>

        </div>


    </form>


    <!-- =================================================
         LOGIN FORM
    ================================================== -->

    <form
        id="loginForm"
        class="form"
        autocomplete="on"
    >


        <div class="field">

            <label>
                البريد الإلكتروني
            </label>

            <input
                id="loginEmail"
                type="email"
                placeholder="example@email.com"
                autocomplete="username"
                required
            >

        </div>


        <div class="field">

            <label>
                كلمة المرور
            </label>

            <div class="password-box">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="loginPassword"
                >
                    ◉
                </button>

            </div>

        </div>


        <button
            id="loginButton"
            class="main-btn"
            type="submit"
        >
            تسجيل الدخول
        </button>


        <div
            id="loginMessage"
            class="message"
        ></div>


    </form>


    <div class="note">

        البريد وكلمة المرور محفوظان في
        Supabase Authentication

        <br>

        بيانات الهاتف وولي الأمر محفوظة في
        profiles

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← العودة للرئيسية
    </a>


</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://cuygojzrgpposlcpthjw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ySp8SmV4CDZaOojNnkNMPA_5S5s_Ia5";


/* =====================================================
   CREATE CLIENT
===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const registerTab =
    document.getElementById(
        "registerTab"
    );

const loginTab =
    document.getElementById(
        "loginTab"
    );

const registerForm =
    document.getElementById(
        "registerForm"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );


/* =====================================================
   SHOW REGISTER
===================================================== */

function showRegister(){

    loginForm.classList.remove(
        "active"
    );

    registerForm.classList.remove(
        "active"
    );

    void registerForm.offsetWidth;

    registerForm.classList.add(
        "active"
    );


    registerTab.classList.add(
        "active"
    );

    loginTab.classList.remove(
        "active"
    );


    clearMessages();


    setTimeout(
        function(){

            const nameInput =
                document.getElementById(
                    "registerName"
                );

            if(nameInput){

                nameInput.focus();

            }

        },
        350
    );

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

    registerForm.classList.remove(
        "active"
    );

    loginForm.classList.remove(
        "active"
    );

    void loginForm.offsetWidth;

    loginForm.classList.add(
        "active"
    );


    loginTab.classList.add(
        "active"
    );

    registerTab.classList.remove(
        "active"
    );


    clearMessages();


    setTimeout(
        function(){

            const emailInput =
                document.getElementById(
                    "loginEmail"
                );

            if(emailInput){

                emailInput.focus();

            }

        },
        350
    );

}


/* =====================================================
   TAB EVENTS
===================================================== */

registerTab.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        showRegister();

    }
);


loginTab.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        showLogin();

    }
);


document
    .getElementById("goToLogin")
    .addEventListener(
        "click",
        function(){

            showLogin();

        }
    );


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

document
    .querySelectorAll(
        ".password-toggle"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const input =
                        document.getElementById(
                            button.dataset.target
                        );

                    if(
                        !input
                    ){

                        return;

                    }


                    if(
                        input.type ===
                        "password"
                    ){

                        input.type =
                            "text";

                        button.textContent =
                            "◌";

                    }
                    else{

                        input.type =
                            "password";

                        button.textContent =
                            "◉";

                    }

                }
            );

        }
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    element,
    text,
    type
){

    element.textContent =
        text;

    element.className =
        "message " + type;

}


function clearMessages(){

    const registerMessage =
        document.getElementById(
            "registerMessage"
        );

    const loginMessage =
        document.getElementById(
            "loginMessage"
        );


    registerMessage.textContent =
        "";

    registerMessage.className =
        "message";


    loginMessage.textContent =
        "";

    loginMessage.className =
        "message";

}


/* =====================================================
   PHONE NORMALIZATION
===================================================== */

function normalizePhone(
    phone
){

    let value =
        String(phone)
            .trim()
            .replace(
                /[\s\-()]/g,
                ""
            );


    if(
        value.startsWith("+20")
    ){

        value =
            "0" +
            value.substring(3);

    }


    return value;

}


/* =====================================================
   REGISTER
===================================================== */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const button =
            document.getElementById(
                "registerButton"
            );

        const message =
            document.getElementById(
                "registerMessage"
            );

        const afterRegister =
            document.getElementById(
                "afterRegister"
            );


        const name =
            document.getElementById(
                "registerName"
            )
            .value
            .trim();


        const email =
            document.getElementById(
                "registerEmail"
            )
            .value
            .trim()
            .toLowerCase();


        const phone =
            normalizePhone(
                document.getElementById(
                    "registerPhone"
                ).value
            );


        const parentPhone =
            normalizePhone(
                document.getElementById(
                    "parentPhone"
                ).value
            );


        const password =
            document.getElementById(
                "registerPassword"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        /* =============================================
           VALIDATION
        ============================================= */

        if(
            name.length < 3
        ){

            showMessage(
                message,
                "اكتب الاسم بالكامل.",
                "error"
            );

            return;

        }


        if(
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email)
        ){

            showMessage(
                message,
                "البريد الإلكتروني غير صحيح.",
                "error"
            );

            return;

        }


        if(
            !/^01[0-9]{9}$/.test(
                phone
            )
        ){

            showMessage(
                message,
                "رقم الهاتف المصري غير صحيح.",
                "error"
            );

            return;

        }


        if(
            !/^01[0-9]{9}$/.test(
                parentPhone
            )
        ){

            showMessage(
                message,
                "رقم هاتف ولي الأمر غير صحيح.",
                "error"
            );

            return;

        }


        if(
            phone === parentPhone
        ){

            showMessage(
                message,
                "رقم الطالب ورقم ولي الأمر يجب أن يكونا مختلفين.",
                "error"
            );

            return;

        }


        if(
            password.length < 6
        ){

            showMessage(
                message,
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
                "error"
            );

            return;

        }


        if(
            password !== confirmPassword
        ){

            showMessage(
                message,
                "كلمتا المرور غير متطابقتين.",
                "error"
            );

            return;

        }


        /* =============================================
           LOADING
        ============================================= */

        button.disabled =
            true;

        button.textContent =
            "جاري إنشاء الحساب...";


        afterRegister.classList.remove(
            "show"
        );


        try{


            /* =========================================
               SUPABASE AUTH
               EMAIL + PASSWORD ONLY
            ========================================= */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email:email,

                    password:password,

                    options:{

                        data:{

                            name:name,

                            phone:phone,

                            parent_phone:
                                parentPhone

                        }

                    }

                });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "لم يتم إنشاء الحساب."
                );

            }


            const userId =
                data.user.id;


            /* =========================================
               SAVE PROFILE
            ========================================= */

            const {
                error:
                profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .upsert(
                        {

                            id:userId,

                            name:name,

                            email:email,

                            phone:phone,

                            parent_phone:
                                parentPhone,

                            role:"student",

                            active:true

                        },
                        {
                            onConflict:"id"
                        }
                    );


            if(profileError){

                console.error(
                    "PROFILE ERROR:",
                    profileError
                );

                throw new Error(
                    "تم إنشاء حساب الدخول، لكن لم يتم حفظ بيانات الملف الشخصي: " +
                    profileError.message
                );

            }


            /* =========================================
               SUCCESS
            ========================================= */

            afterRegister.classList.add(
                "show"
            );


            if(
                data.session
            ){

                showMessage(
                    message,
                    "تم إنشاء الحساب وحفظ بياناتك بنجاح. يمكنك تسجيل الدخول الآن.",
                    "success"
                );

            }
            else{

                showMessage(
                    message,
                    "تم إنشاء الحساب وحفظ بياناتك. افتح بريدك الإلكتروني لتأكيد الحساب، ثم سجل الدخول.",
                    "success"
                );

            }

        }
        catch(error){

            console.error(
                "REGISTER ERROR:",
                error
            );


            let text =
                error?.message ||
                "حدث خطأ أثناء إنشاء الحساب.";


            const lower =
                text.toLowerCase();


            if(
                lower.includes(
                    "already registered"
                )
                ||
                lower.includes(
                    "user already registered"
                )
            ){

                text =
                    "هذا البريد الإلكتروني مسجل بالفعل.";

            }


            if(
                lower.includes(
                    "duplicate"
                )
            ){

                text =
                    "هذه البيانات موجودة بالفعل.";

            }


            showMessage(
                message,
                text,
                "error"
            );

        }
        finally{

            button.disabled =
                false;

            button.textContent =
                "إنشاء الحساب";

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const button =
            document.getElementById(
                "loginButton"
            );

        const message =
            document.getElementById(
                "loginMessage"
            );


        const email =
            document.getElementById(
                "loginEmail"
            )
            .value
            .trim()
            .toLowerCase();


        const password =
            document.getElementById(
                "loginPassword"
            ).value;


        /* =============================================
           VALIDATION
        ============================================= */

        if(
            !email ||
            !password
        ){

            showMessage(
                message,
                "أدخل البريد الإلكتروني وكلمة المرور.",
                "error"
            );

            return;

        }


        if(
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email)
        ){

            showMessage(
                message,
                "أدخل بريدًا إلكترونيًا صحيحًا.",
                "error"
            );

            return;

        }


        /* =============================================
           LOADING
        ============================================= */

        button.disabled =
            true;

        button.textContent =
            "جاري تسجيل الدخول...";


        try{


            /* =========================================
               SIGN IN
               EMAIL + PASSWORD ONLY
            ========================================= */

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email:email,

                        password:password

                    });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "تعذر تسجيل الدخول."
                );

            }


            /* =========================================
               GET PROFILE
            ========================================= */

            const {
                data:
                profile,
                error:
                profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "name,role,active"
                    )
                    .eq(
                        "id",
                        data.user.id
                    )
                    .maybeSingle();


            if(profileError){

                throw new Error(
                    "تم تسجيل الدخول، ولكن تعذر قراءة بيانات الحساب: " +
                    profileError.message
                );

            }


            /* =========================================
               ACTIVE CHECK
            ========================================= */

            if(
                profile &&
                profile.active === false
            ){

                await supabaseClient.auth.signOut();

                throw new Error(
                    "هذا الحساب غير نشط."
                );

            }


            /* =========================================
               SUCCESS
            ========================================= */

            showMessage(
                message,
                "تم تسجيل الدخول بنجاح...",
                "success"
            );


            /* =========================================
               ADMIN
            ========================================= */

            if(
                profile &&
                profile.role === "admin"
            ){

                setTimeout(
                    function(){

                        window.location.href =
                            "admin/index.html";

                    },
                    700
                );

                return;

            }


            /* =========================================
               STUDENT
            ========================================= */

            setTimeout(
                function(){

                    window.location.href =
                        "home.html";

                },
                700
            );

        }
        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            let text =
                error?.message ||
                "بيانات تسجيل الدخول غير صحيحة.";


            const lower =
                text.toLowerCase();


            if(
                lower.includes(
                    "invalid login credentials"
                )
            ){

                text =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }


            if(
                lower.includes(
                    "email not confirmed"
                )
            ){

                text =
                    "يجب تأكيد البريد الإلكتروني أولًا. افتح رسالة التأكيد التي أرسلها Supabase.";

            }


            if(
                lower.includes(
                    "too many requests"
                )
            ){

                text =
                    "تم إجراء محاولات كثيرة. حاول مرة أخرى بعد قليل.";

            }


            showMessage(
                message,
                text,
                "error"
            );

        }
        finally{

            button.disabled =
                false;

            button.textContent =
                "تسجيل الدخول";

        }

    }
);


/* =====================================================
   CHECK SESSION
===================================================== */

(async function(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .getSession();


        if(error){

            console.error(
                "SESSION ERROR:",
                error
            );

            return;

        }


        if(
            data &&
            data.session
        ){

            console.log(
                "Supabase session active."
            );

        }

    }
    catch(error){

        console.error(
            "SESSION CHECK ERROR:",
            error
        );

    }

})();


/* =====================================================
   DEFAULT SCREEN
   إنشاء الحساب يظهر أولًا
===================================================== */

showRegister();

</script>
