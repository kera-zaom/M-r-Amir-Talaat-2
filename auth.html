<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | الحساب</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(255,255,255,.12),
            transparent 34%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(150,150,150,.05),
            transparent 35%
        ),
        #020202;

    overflow-x:hidden;
}


/* ================================
   BACKGROUND
================================ */

.background{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-2;
}

.grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    mask-image:
        radial-gradient(
            circle at center,
            black,
            transparent 85%
        );
}

.glow{
    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);

    filter:blur(120px);
}

.glow.one{
    top:-220px;
    right:-120px;
}

.glow.two{
    bottom:-240px;
    left:-130px;
}


/* ================================
   CARD
================================ */

.card{

    width:min(
        460px,
        100%
    );

    padding:
        30px 25px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(20,20,20,.94),
            rgba(5,5,5,.90)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 35px 120px
        rgba(0,0,0,.8),

        inset 0 1px 0
        rgba(255,255,255,.04);

    backdrop-filter:
        blur(25px);

    animation:
        cardIn .7s ease;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            translateY(20px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}


/* ================================
   LOGO
================================ */

.logo{

    width:76px;
    height:76px;

    margin:
        0 auto 17px;

    border-radius:23px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #777
        );

    border:
        1px solid
        rgba(255,255,255,.2);

    box-shadow:
        0 15px 40px
        rgba(255,255,255,.08);

    animation:
        floating 3.5s ease-in-out infinite;
}

.logo img{

    width:100%;
    height:100%;

    object-fit:cover;

}

@keyframes floating{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(0);
    }

    50%{
        transform:
            translateY(-6px)
            rotate(2deg);
    }

}


/* ================================
   TITLE
================================ */

h1{

    text-align:center;

    font-size:23px;

    font-weight:700;

    letter-spacing:.3px;

    margin-bottom:7px;
}

.subtitle{

    text-align:center;

    color:#5d5d5d;

    font-size:9px;

    margin-bottom:26px;

}


/* ================================
   TABS
================================ */

.tabs{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:4px;

    padding:4px;

    margin-bottom:23px;

    border-radius:14px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.03);
}

.tab{

    height:41px;

    border:0;

    border-radius:10px;

    background:transparent;

    color:#555;

    cursor:pointer;

    font-size:10px;

    transition:
        .25s ease;
}

.tab:hover{

    color:#aaa;

}

.tab.active{

    color:#111;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #a6a6a6
        );

    box-shadow:
        0 5px 18px
        rgba(255,255,255,.05);
}


/* ================================
   FORMS
================================ */

.form{

    display:none;

    animation:
        formIn .35s ease;
}

.form.active{

    display:block;
}

@keyframes formIn{

    from{
        opacity:0;
        transform:
            translateY(7px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }

}


/* ================================
   FIELD
================================ */

.field{

    margin-bottom:13px;

}

label{

    display:block;

    color:#6b6b6b;

    font-size:9px;

    margin-bottom:7px;

}

input{

    width:100%;

    height:47px;

    padding:
        0 14px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.025);

    color:#fff;

    outline:none;

    font-size:10px;

    transition:
        .25s ease;
}

input::placeholder{

    color:#404040;

}

input:focus{

    border-color:
        rgba(255,255,255,.22);

    background:
        rgba(255,255,255,.045);

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.02);
}


/* ================================
   PASSWORD
================================ */

.password-wrap{

    position:relative;

}

.password-wrap input{

    padding-left:50px;

}

.toggle-password{

    position:absolute;

    left:12px;
    top:50%;

    transform:
        translateY(-50%);

    border:0;

    background:transparent;

    color:#555;

    cursor:pointer;

    font-size:12px;

    transition:.2s;

}

.toggle-password:hover{

    color:#aaa;

}


/* ================================
   BUTTON
================================ */

.main-btn{

    width:100%;

    height:49px;

    margin-top:7px;

    border:0;

    border-radius:14px;

    cursor:pointer;

    color:#080808;

    font-weight:bold;

    font-size:10px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #a7a7a7
        );

    box-shadow:
        0 10px 30px
        rgba(255,255,255,.04);

    transition:
        .25s ease;
}

.main-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 35px
        rgba(255,255,255,.08);
}

.main-btn:active{

    transform:
        translateY(0);

}

.main-btn:disabled{

    opacity:.45;

    cursor:not-allowed;

    transform:none;

}


/* ================================
   MESSAGE
================================ */

.message{

    min-height:21px;

    margin-top:14px;

    text-align:center;

    font-size:9px;

    line-height:1.8;

}

.message.success{

    color:#bdbdbd;

}

.message.error{

    color:#a0a0a0;

}


/* ================================
   FOOTER
================================ */

.small-note{

    text-align:center;

    color:#414141;

    font-size:8px;

    line-height:1.8;

    margin-top:18px;

}

.back{

    display:block;

    margin-top:15px;

    text-align:center;

    color:#555;

    text-decoration:none;

    font-size:9px;

    transition:.2s;

}

.back:hover{

    color:#aaa;

}


/* ================================
   MOBILE
================================ */

@media(max-width:480px){

    body{

        padding:12px;

        align-items:flex-start;

        padding-top:25px;

    }

    .card{

        padding:
            25px 17px;

        border-radius:25px;

    }

    h1{

        font-size:21px;

    }

    .logo{

        width:70px;
        height:70px;

    }

}

</style>

</head>


<body>


<div class="background">

    <div class="grid"></div>

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>


<div class="card">


    <!-- LOGO -->

    <div class="logo">

        <img
            src="teacher.png"
            alt="الخوارزمي"
        >

    </div>


    <h1>
        الخوارزمي
    </h1>


    <div class="subtitle">
        منصة الاختبارات الإلكترونية
    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            type="button"
            class="tab active"
            id="loginTab"
        >
            تسجيل الدخول
        </button>


        <button
            type="button"
            class="tab"
            id="registerTab"
        >
            إنشاء حساب
        </button>

    </div>


    <!-- =================================
         LOGIN FORM
    ================================== -->

    <form
        id="loginForm"
        class="form active"
    >


        <div class="field">

            <label>
                البريد الإلكتروني أو رقم الهاتف
            </label>

            <input
                id="loginIdentifier"
                type="text"
                placeholder="example@email.com أو 01xxxxxxxxx"
                autocomplete="username"
                required
            >

        </div>


        <div class="field">

            <label>
                كلمة المرور
            </label>


            <div class="password-wrap">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    onclick="
                        togglePassword(
                            'loginPassword',
                            this
                        )
                    "
                >
                    ◉
                </button>

            </div>

        </div>


        <button
            id="loginButton"
            class="main-btn"
            type="submit"
        >
            تسجيل الدخول
        </button>


        <div
            id="loginMessage"
            class="message"
        ></div>


    </form>


    <!-- =================================
         REGISTER FORM
    ================================== -->

    <form
        id="registerForm"
        class="form"
    >


        <div class="field">

            <label>
                الاسم الكامل
            </label>

            <input
                id="registerName"
                type="text"
                placeholder="اكتب اسمك بالكامل"
                autocomplete="name"
                required
            >

        </div>


        <div class="field">

            <label>
                البريد الإلكتروني
            </label>

            <input
                id="registerEmail"
                type="email"
                placeholder="example@email.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="field">

            <label>
                رقم الهاتف
            </label>

            <input
                id="registerPhone"
                type="tel"
                inputmode="tel"
                placeholder="01xxxxxxxxx"
                autocomplete="tel"
                required
            >

        </div>


        <div class="field">

            <label>
                رقم هاتف ولي الأمر
            </label>

            <input
                id="parentPhone"
                type="tel"
                inputmode="tel"
                placeholder="01xxxxxxxxx"
                autocomplete="tel"
                required
            >

        </div>


        <div class="field">

            <label>
                كلمة المرور
            </label>


            <div class="password-wrap">

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="6 أحرف أو أكثر"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    onclick="
                        togglePassword(
                            'registerPassword',
                            this
                        )
                    "
                >
                    ◉
                </button>

            </div>

        </div>


        <div class="field">

            <label>
                تأكيد كلمة المرور
            </label>


            <div class="password-wrap">

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    onclick="
                        togglePassword(
                            'confirmPassword',
                            this
                        )
                    "
                >
                    ◉
                </button>

            </div>

        </div>


        <button
            id="registerButton"
            class="main-btn"
            type="submit"
        >
            إنشاء الحساب
        </button>


        <div
            id="registerMessage"
            class="message"
        ></div>


    </form>


    <div class="small-note">

        بيانات الحساب محفوظة بشكل آمن
        داخل قاعدة بيانات المنصة

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← العودة للرئيسية
    </a>


</div>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://cuygojzrgpposlcpthjw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ySp8SmV4CDZaOojNnkNMPA_5S5s_Ia5";


const {
    createClient
} = window.supabase;


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const loginTab =
    document.getElementById(
        "loginTab"
    );

const registerTab =
    document.getElementById(
        "registerTab"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const registerForm =
    document.getElementById(
        "registerForm"
    );


/* =========================================
   SWITCH TABS
========================================= */

loginTab.addEventListener(
    "click",
    () => {

        loginTab.classList.add(
            "active"
        );

        registerTab.classList.remove(
            "active"
        );

        loginForm.classList.add(
            "active"
        );

        registerForm.classList.remove(
            "active"
        );

        clearMessages();

    }
);


registerTab.addEventListener(
    "click",
    () => {

        registerTab.classList.add(
            "active"
        );

        loginTab.classList.remove(
            "active"
        );

        registerForm.classList.add(
            "active"
        );

        loginForm.classList.remove(
            "active"
        );

        clearMessages();

    }
);


/* =========================================
   PASSWORD TOGGLE
========================================= */

function togglePassword(
    inputId,
    button
){

    const input =
        document.getElementById(
            inputId
        );


    if(
        input.type ===
        "password"
    ){

        input.type =
            "text";

        button.textContent =
            "◌";

    }else{

        input.type =
            "password";

        button.textContent =
            "◉";

    }

}


/* =========================================
   MESSAGES
========================================= */

function showMessage(
    element,
    text,
    type
){

    element.textContent =
        text;

    element.className =
        "message " + type;

}


function clearMessages(){

    document.getElementById(
        "loginMessage"
    ).textContent = "";

    document.getElementById(
        "registerMessage"
    ).textContent = "";

}


/* =========================================
   PHONE NORMALIZATION
========================================= */

function normalizePhone(
    phone
){

    let value =
        String(phone)
        .trim()
        .replace(
            /[\s\-()]/g,
            ""
        );


    if(
        value.startsWith(
            "+20"
        )
    ){

        value =
            "0" +
            value.substring(3);

    }


    return value;

}


/* =========================================
   REGISTER
========================================= */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const button =
            document.getElementById(
                "registerButton"
            );

        const message =
            document.getElementById(
                "registerMessage"
            );


        const name =
            document.getElementById(
                "registerName"
            )
            .value
            .trim();


        const email =
            document.getElementById(
                "registerEmail"
            )
            .value
            .trim()
            .toLowerCase();


        const phone =
            normalizePhone(
                document.getElementById(
                    "registerPhone"
                ).value
            );


        const parentPhone =
            normalizePhone(
                document.getElementById(
                    "parentPhone"
                ).value
            );


        const password =
            document.getElementById(
                "registerPassword"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        /* VALIDATION */

        if(
            name.length < 3
        ){

            showMessage(
                message,
                "اكتب الاسم بالكامل.",
                "error"
            );

            return;

        }


        if(
            password.length < 6
        ){

            showMessage(
                message,
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
                "error"
            );

            return;

        }


        if(
            password !==
            confirmPassword
        ){

            showMessage(
                message,
                "كلمتا المرور غير متطابقتين.",
                "error"
            );

            return;

        }


        if(
            !/^01[0-9]{9}$/.test(
                phone
            )
        ){

            showMessage(
                message,
                "رقم الهاتف المصري غير صحيح.",
                "error"
            );

            return;

        }


        if(
            !/^01[0-9]{9}$/.test(
                parentPhone
            )
        ){

            showMessage(
                message,
                "رقم ولي الأمر غير صحيح.",
                "error"
            );

            return;

        }


        if(
            phone ===
            parentPhone
        ){

            showMessage(
                message,
                "رقم الطالب ورقم ولي الأمر يجب أن يكونا مختلفين.",
                "error"
            );

            return;

        }


        button.disabled =
            true;

        button.textContent =
            "جاري إنشاء الحساب...";


        try{


            /* CHECK PHONE */

            const {
                data:
                existingPhone,
                error:
                phoneCheckError
            } =
                await supabase.rpc(
                    "get_login_email_by_phone",
                    {
                        p_phone:phone
                    }
                );


            if(
                phoneCheckError
            ){

                console.warn(
                    phoneCheckError
                );

            }


            if(
                existingPhone
            ){

                throw new Error(
                    "رقم الهاتف مستخدم بالفعل."
                );

            }


            /* CREATE AUTH USER */

            const {
                data,
                error
            } =
                await supabase.auth
                .signUp({

                    email:email,

                    password:password,

                    options:{

                        data:{

                            name:name

                        }

                    }

                });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "لم يتم إنشاء الحساب."
                );

            }


            const userId =
                data.user.id;


            /*
             * حفظ بيانات الطالب
             */

            const {
                error:
                profileError
            } =
                await supabase
                .from("profiles")
                .upsert({

                    id:userId,

                    name:name,

                    email:email,

                    phone:phone,

                    parent_phone:
                        parentPhone,

                    role:"student",

                    active:true

                });


            if(
                profileError
            ){

                console.error(
                    profileError
                );

                throw new Error(
                    "تم إنشاء الحساب ولكن حدث خطأ في حفظ بيانات الطالب."
                );

            }


            /*
             * إذا كان تأكيد البريد الإلكتروني
             * مفعلًا في Supabase
             */

            if(
                !data.session
            ){

                showMessage(
                    message,
                    "تم إنشاء الحساب. افتح بريدك الإلكتروني لتأكيد الحساب ثم سجل الدخول.",
                    "success"
                );

                return;

            }


            showMessage(
                message,
                "تم إنشاء الحساب بنجاح. جاري الدخول...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "home.html";

                },
                900
            );


        }catch(error){

            console.error(
                error
            );


            let text =
                "حدث خطأ أثناء إنشاء الحساب.";


            const errorMessage =
                String(
                    error?.message ||
                    ""
                );


            if(
                errorMessage.includes(
                    "already registered"
                )
                ||
                errorMessage.includes(
                    "User already registered"
                )
            ){

                text =
                    "هذا البريد الإلكتروني مسجل بالفعل.";

            }


            if(
                errorMessage.includes(
                    "رقم الهاتف مستخدم"
                )
            ){

                text =
                    errorMessage;

            }


            showMessage(
                message,
                text,
                "error"
            );


        }finally{

            button.disabled =
                false;

            button.textContent =
                "إنشاء الحساب";

        }

    }
);


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const button =
            document.getElementById(
                "loginButton"
            );

        const message =
            document.getElementById(
                "loginMessage"
            );


        const identifier =
            document.getElementById(
                "loginIdentifier"
            )
            .value
            .trim();


        const password =
            document.getElementById(
                "loginPassword"
            ).value;


        if(
            !identifier ||
            !password
        ){

            showMessage(
                message,
                "أدخل البريد/رقم الهاتف وكلمة المرور.",
                "error"
            );

            return;

        }


        button.disabled =
            true;

        button.textContent =
            "جاري تسجيل الدخول...";


        try{

            let email =
                identifier;


            /*
             * LOGIN BY PHONE
             */

            if(
                !identifier.includes(
                    "@"
                )
            ){

                const phone =
                    normalizePhone(
                        identifier
                    );


                if(
                    !/^01[0-9]{9}$/.test(
                        phone
                    )
                ){

                    throw new Error(
                        "رقم الهاتف غير صحيح."
                    );

                }


                const {
                    data:
                    loginEmail,
                    error:
                    phoneError
                } =
                    await supabase.rpc(
                        "get_login_email_by_phone",
                        {
                            p_phone:phone
                        }
                    );


                if(
                    phoneError
                ){

                    throw phoneError;

                }


                if(
                    !loginEmail
                ){

                    throw new Error(
                        "رقم الهاتف غير مسجل أو الحساب غير نشط."
                    );

                }


                email =
                    loginEmail;

            }


            /*
             * LOGIN BY EMAIL
             */

            const {
                data,
                error
            } =
                await supabase.auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "بيانات تسجيل الدخول غير صحيحة."
                );

            }


            /*
             * GET PROFILE
             */

            const {
                data:
                profile,
                error:
                profileError
            } =
                await supabase
                .from("profiles")
                .select(
                    "name,role,active"
                )
                .eq(
                    "id",
                    data.user.id
                )
                .maybeSingle();


            if(
                profileError
            ){

                throw profileError;

            }


            if(
                profile &&
                profile.active === false
            ){

                await supabase.auth
                    .signOut();

                throw new Error(
                    "هذا الحساب غير نشط."
                );

            }


            showMessage(
                message,
                "تم تسجيل الدخول بنجاح...",
                "success"
            );


            /*
             * ADMIN
             */

            if(
                profile &&
                profile.role ===
                "admin"
            ){

                setTimeout(
                    () => {

                        window.location.href =
                            "admin/index.html";

                    },
                    700
                );

            }

            /*
             * STUDENT
             */

            else{

                setTimeout(
                    () => {

                        window.location.href =
                            "home.html";

                    },
                    700
                );

            }


        }catch(error){

            console.error(
                error
            );


            let text =
                "البريد/رقم الهاتف أو كلمة المرور غير صحيحة.";


            const errorMessage =
                String(
                    error?.message ||
                    ""
                );


            if(
                errorMessage.includes(
                    "غير مسجل"
                )
            ){

                text =
                    errorMessage;

            }


            if(
                errorMessage.includes(
                    "غير صحيح"
                )
            ){

                text =
                    errorMessage;

            }


            if(
                errorMessage.includes(
                    "Invalid login credentials"
                )
            ){

                text =
                    "بيانات تسجيل الدخول غير صحيحة.";

            }


            if(
                errorMessage.includes(
                    "Email not confirmed"
                )
            ){

                text =
                    "يجب تأكيد البريد الإلكتروني أولًا.";

            }


            if(
                errorMessage.includes(
                    "غير نشط"
                )
            ){

                text =
                    errorMessage;

            }


            showMessage(
                message,
                text,
                "error"
            );


        }finally{

            button.disabled =
                false;

            button.textContent =
                "تسجيل الدخول";

        }

    }
);

   CHECK CURRENT SESSION
========================================= */

    try{

        const {
            data
        } =
            await supabase.auth
            .getSession();


        if(
            data &&
            data.session
        ){

            console.log(
                "User session active"
            );

        }

    }catch(error){

        console.error(
            error
        );

    }

})();

</script>
