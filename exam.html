<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | الاختبار</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(255,255,255,.08),
            transparent 35%
        ),
        #020202;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;
}

.grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );

    background-size:55px 55px;
}

.glow{
    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);

    filter:blur(110px);
}

.glow.one{
    top:-250px;
    right:-150px;
}

.glow.two{
    bottom:-250px;
    left:-150px;
}

/* =========================
   HEADER
========================= */

header{
    width:min(
        1180px,
        calc(100% - 32px)
    );

    height:76px;

    margin:18px auto;

    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        rgba(9,9,9,.84);

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:20px;

    backdrop-filter:blur(20px);

    position:relative;
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;

    color:white;
    text-decoration:none;
}

.logo-icon{
    width:46px;
    height:46px;

    overflow:hidden;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #888
        );

    animation:
        logoFloat 3.5s ease-in-out infinite;
}

.logo-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

@keyframes logoFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-4px)
            rotate(2deg);
    }

}

.logo-text strong{
    display:block;
    font-size:17px;
}

.logo-text span{
    display:block;

    color:#666;

    font-size:10px;

    margin-top:3px;
}

.back-btn{
    color:#aaa;

    text-decoration:none;

    padding:10px 15px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    font-size:11px;

    transition:.3s;
}

.back-btn:hover{
    color:white;
    background:
        rgba(255,255,255,.07);
}

/* =========================
   MAIN
========================= */

main{
    width:min(
        900px,
        calc(100% - 32px)
    );

    margin:auto;

    padding:35px 0 80px;
}

/* =========================
   EXAM TOP
========================= */

.exam-header{
    padding:28px;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    margin-bottom:20px;
}

.exam-label{
    display:inline-block;

    padding:7px 11px;

    border-radius:30px;

    color:#888;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.07);

    font-size:9px;

    margin-bottom:13px;
}

.exam-header h1{
    font-size:
        clamp(25px,5vw,40px);

    margin-bottom:10px;
}

.exam-header p{
    color:#666;

    font-size:12px;

    line-height:1.9;
}

/* =========================
   PROGRESS
========================= */

.progress-area{
    margin-top:25px;
}

.progress-info{
    display:flex;

    justify-content:space-between;

    color:#777;

    font-size:10px;

    margin-bottom:8px;
}

.progress{
    width:100%;
    height:5px;

    background:
        rgba(255,255,255,.07);

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;

    background:
        linear-gradient(
            90deg,
            #777,
            #fff
        );

    border-radius:20px;

    transition:.3s;
}

/* =========================
   TIMER
========================= */

.timer{
    margin-top:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    padding:13px;

    border-radius:14px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.06);

    color:#aaa;

    font-size:11px;
}

.timer strong{
    color:white;

    font-size:16px;

    direction:ltr;
}

/* =========================
   QUESTION
========================= */

.question-card{
    padding:30px;

    border-radius:24px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    margin-bottom:18px;
}

.question-number{
    color:#666;

    font-size:10px;

    margin-bottom:14px;
}

.question-text{
    font-size:20px;

    line-height:1.8;

    margin-bottom:25px;
}

/* =========================
   OPTIONS
========================= */

.options{
    display:grid;

    gap:12px;
}

.option{
    position:relative;

    display:flex;

    align-items:center;

    gap:12px;

    padding:16px;

    border-radius:15px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.07);

    cursor:pointer;

    transition:.25s;
}

.option:hover{
    background:
        rgba(255,255,255,.055);

    border-color:
        rgba(255,255,255,.15);
}

.option input{
    position:absolute;

    opacity:0;
}

.radio{
    width:20px;
    height:20px;

    flex-shrink:0;

    border-radius:50%;

    border:
        1px solid
        #555;

    position:relative;
}

.option input:checked + .radio{
    border-color:white;
}

.option input:checked + .radio::after{
    content:"";

    position:absolute;

    width:9px;
    height:9px;

    border-radius:50%;

    background:white;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);
}

.option.selected{
    border-color:
        rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.065);
}

.option-text{
    color:#aaa;

    font-size:13px;

    line-height:1.7;
}

/* =========================
   NAVIGATION
========================= */

.navigation{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-top:18px;
}

.nav-btn{
    min-width:130px;

    padding:13px 20px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color:#aaa;

    cursor:pointer;

    font-size:11px;

    transition:.3s;
}

.nav-btn:hover{
    color:white;

    background:
        rgba(255,255,255,.07);
}

.nav-btn.primary{
    border:none;

    color:#050505;

    background:
        linear-gradient(
            135deg,
            #fff,
            #aaa
        );

    font-weight:bold;
}

.nav-btn:disabled{
    opacity:.3;

    cursor:not-allowed;
}

/* =========================
   RESULT
========================= */

.result{
    display:none;

    padding:40px 25px;

    text-align:center;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.02)
        );

    border:
        1px solid
        rgba(255,255,255,.12);
}

.result.show{
    display:block;
}

.result-logo{
    width:85px;
    height:85px;

    margin:0 auto 20px;

    overflow:hidden;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #777
        );

    animation:
        resultFloat 3s ease-in-out infinite;
}

.result-logo img{
    width:100%;
    height:100%;

    object-fit:cover;
}

@keyframes resultFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }

}

.result h2{
    font-size:27px;

    margin-bottom:10px;
}

.result p{
    color:#777;

    font-size:12px;

    margin-bottom:20px;
}

.score{
    font-size:52px;

    font-weight:bold;

    background:
        linear-gradient(
            90deg,
            white,
            #777
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    margin-bottom:25px;
}

.result-buttons{
    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;
}

.result-btn{
    min-width:150px;

    padding:12px 18px;

    border-radius:12px;

    text-decoration:none;

    color:#050505;

    background:
        linear-gradient(
            135deg,
            white,
            #aaa
        );

    font-size:11px;

    font-weight:bold;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:70px 20px;

    text-align:center;

    border-radius:24px;

    border:
        1px dashed
        rgba(255,255,255,.1);

    color:#555;
}

.empty img{
    width:70px;
    height:70px;

    object-fit:cover;

    border-radius:20px;

    opacity:.45;

    margin-bottom:18px;
}

.empty strong{
    display:block;

    color:#777;

    font-size:14px;

    margin-bottom:8px;
}

.empty span{
    color:#444;

    font-size:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        width:
            calc(100% - 20px);

        height:68px;

        margin-top:10px;

        padding:0 13px;
    }

    .logo-icon{
        width:40px;
        height:40px;
    }

    .logo-text strong{
        font-size:15px;
    }

    main{
        width:
            calc(100% - 20px);

        padding-top:20px;
    }

    .exam-header,
    .question-card{
        padding:22px 18px;
    }

    .question-text{
        font-size:17px;
    }

    .navigation{
        flex-direction:column;
    }

    .nav-btn{
        width:100%;
    }

}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

    <div class="grid"></div>

</div>


<!-- =========================
     HEADER
========================= -->

<header>

    <a
        href="home.html"
        class="logo"
    >

        <div class="logo-icon">

            <img
                src="teacher.png"
                alt="الماستر"
            >

        </div>

        <div class="logo-text">

            <strong>
                الخوارزمي
            </strong>

            <span>
                منصة الاختبارات
            </span>

        </div>

    </a>


    <a
        href="tests.html"
        class="back-btn"
    >
        ← الاختبارات
    </a>

</header>


<!-- =========================
     MAIN
========================= -->

<main id="examApp">


    <!-- سيتم إنشاء محتوى الاختبار هنا -->

</main>


<script>

/* ==========================================
   GET EXAM ID
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const examId =
    params.get("id");


/* ==========================================
   LOAD TESTS
========================================== */

let tests = [];

try {

    tests =
        JSON.parse(
            localStorage.getItem("tests") || "[]"
        );

} catch {

    tests = [];

}


/* ==========================================
   FIND EXAM
========================================== */

let exam =
    tests.find(
        function(test){

            return String(test.id) ===
                String(examId);

        }
    );


const app =
    document.getElementById(
        "examApp"
    );


/* ==========================================
   NO EXAM
========================================== */

if(!exam){

    app.innerHTML = `

        <div class="empty">

            <img
                src="teacher.png"
                alt="الماستر"
            >

            <strong>
                الاختبار غير موجود
            </strong>

            <span>
                لم يتم العثور على الاختبار المطلوب.
            </span>

        </div>

    `;

}


/* ==========================================
   EXAM EXISTS
========================================== */

else{

    startExam(exam);

}


/* ==========================================
   START EXAM
========================================== */

function startExam(exam){

    const questions =
        Array.isArray(exam.questionsList)
            ? exam.questionsList
            : Array.isArray(exam.questions)
                ? exam.questions
                : [];


    /* لا توجد أسئلة */

    if(questions.length === 0){

        app.innerHTML = `

            <div class="empty">

                <img
                    src="teacher.png"
                    alt="الماستر"
                >

                <strong>
                    الاختبار لا يحتوي على أسئلة
                </strong>

                <span>
                    سيظهر الاختبار هنا بعد إضافة
                    الأسئلة من لوحة الإدارة.
                </span>

            </div>

        `;

        return;

    }


    let currentQuestion = 0;

    let answers = [];

    let seconds =
        Number(exam.duration || 0) * 60;


    let timerInterval;


    /* ======================================
       RENDER EXAM
    ====================================== */

    app.innerHTML = `

        <section class="exam-header">

            <span class="exam-label">
                اختبار إلكتروني
            </span>

            <h1>
                ${escapeHTML(
                    exam.title || "اختبار"
                )}
            </h1>

            <p>
                ${escapeHTML(
                    exam.description ||
                    "أجب عن جميع الأسئلة ثم اضغط إنهاء الاختبار."
                )}
            </p>


            <div class="progress-area">

                <div class="progress-info">

                    <span id="questionCounter">
                        السؤال 1 من ${questions.length}
                    </span>

                    <span id="percentage">
                        0%
                    </span>

                </div>

                <div class="progress">

                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>

                </div>

            </div>


            ${
                seconds > 0
                ? `
                    <div class="timer">

                        الوقت المتبقي:

                        <strong id="timer">
                            ${formatTime(seconds)}
                        </strong>

                    </div>
                `
                : ""
            }

        </section>


        <section
            id="questionArea"
        ></section>


        <div
            class="navigation"
            id="navigation"
        >

            <button
                class="nav-btn"
                id="prevBtn"
                onclick="previousQuestion()"
            >
                السابق
            </button>


            <button
                class="nav-btn primary"
                id="nextBtn"
                onclick="nextQuestion()"
            >
                التالي
            </button>

        </div>


        <section
            class="result"
            id="result"
        >

            <div class="result-logo">

                <img
                    src="teacher.png"
                    alt="الماستر"
                >

            </div>

            <h2>
                انتهى الاختبار
            </h2>

            <p>
                تم تسجيل نتيجتك بنجاح.
            </p>

            <div
                class="score"
                id="score"
            >
                0%
            </div>

            <div class="result-buttons">

                <a
                    href="tests.html"
                    class="result-btn"
                >
                    الاختبارات
                </a>

                <a
                    href="home.html"
                    class="result-btn"
                >
                    الرئيسية
                </a>

            </div>

        </section>

    `;


    renderQuestion();


    /* ======================================
       TIMER
    ====================================== */

    if(seconds > 0){

        timerInterval =
            setInterval(
                function(){

                    seconds--;

                    const timer =
                        document.getElementById(
                            "timer"
                        );

                    if(timer){

                        timer.textContent =
                            formatTime(seconds);

                    }


                    if(seconds <= 0){

                        clearInterval(
                            timerInterval
                        );

                        finishExam();

                    }

                },
                1000
            );

    }


    /* ======================================
       RENDER QUESTION
    ====================================== */

    function renderQuestion(){

        const question =
            questions[currentQuestion];


        const area =
            document.getElementById(
                "questionArea"
            );


        const options =
            Array.isArray(question.options)
                ? question.options
                : [];


        let optionsHTML = "";


        options.forEach(
            function(option,index){

                const checked =
                    answers[currentQuestion] ===
                    index
                        ? "checked"
                        : "";


                optionsHTML += `

                    <label
                        class="option ${
                            checked
                            ? "selected"
                            : ""
                        }"
                    >

                        <input
                            type="radio"
                            name="answer"
                            value="${index}"
                            ${checked}
                        >

                        <span class="radio"></span>

                        <span class="option-text">
                            ${escapeHTML(option)}
                        </span>

                    </label>

                `;

            }
        );


        area.innerHTML = `

            <article class="question-card">

                <div class="question-number">

                    السؤال
                    ${currentQuestion + 1}
                    من
                    ${questions.length}

                </div>


                <div class="question-text">

                    ${escapeHTML(
                        question.text ||
                        question.question ||
                        "السؤال"
                    )}

                </div>


                <div class="options">

                    ${optionsHTML}

                </div>

            </article>

        `;


        document
            .querySelectorAll(".option")
            .forEach(
                function(option){

                    option.addEventListener(
                        "click",
                        function(){

                            document
                                .querySelectorAll(
                                    ".option"
                                )
                                .forEach(
                                    o =>
                                        o.classList.remove(
                                            "selected"
                                        )
                                );


                            this.classList.add(
                                "selected"
                            );

                        }
                    );

                }
            );


        document
            .querySelectorAll(
                'input[name="answer"]'
            )
            .forEach(
                function(input){

                    input.addEventListener(
                        "change",
                        function(){

                            answers[
                                currentQuestion
                            ] =
                                Number(
                                    this.value
                                );

                        }
                    );

                }
            );


        updateNavigation();

    }


    /* ======================================
       NAVIGATION
    ====================================== */

    window.nextQuestion =
        function(){

            const selected =
                document.querySelector(
                    'input[name="answer"]:checked'
                );


            if(selected){

                answers[
                    currentQuestion
                ] =
                    Number(
                        selected.value
                    );

            }


            if(
                currentQuestion <
                questions.length - 1
            ){

                currentQuestion++;

                renderQuestion();

            }

            else{

                finishExam();

            }

        };


    window.previousQuestion =
        function(){

            if(currentQuestion > 0){

                currentQuestion--;

                renderQuestion();

            }

        };


    function updateNavigation(){

        const prev =
            document.getElementById(
                "prevBtn"
            );

        const next =
            document.getElementById(
                "nextBtn"
            );


        prev.disabled =
            currentQuestion === 0;


        if(
            currentQuestion ===
            questions.length - 1
        ){

            next.textContent =
                "إنهاء الاختبار";

        }

        else{

            next.textContent =
                "التالي";

        }


        const percentage =
            Math.round(
                (
                    (currentQuestion + 1)
                    /
                    questions.length
                ) * 100
            );


        document.getElementById(
            "questionCounter"
        ).textContent =
            `السؤال ${
                currentQuestion + 1
            } من ${
                questions.length
            }`;


        document.getElementById(
            "percentage"
        ).textContent =
            percentage + "%";


        document.getElementById(
            "progressBar"
        ).style.width =
            percentage + "%";

    }


    /* ======================================
       FINISH
    ====================================== */

    function finishExam(){

        clearInterval(
            timerInterval
        );


        /* منع التكرار */

        if(
            document
                .getElementById("result")
                .classList
                .contains("show")
        ){

            return;

        }


        let correct = 0;


        questions.forEach(
            function(question,index){

                const correctAnswer =
                    question.correctAnswer;


                if(
                    answers[index] !== undefined &&
                    String(
                        answers[index]
                    ) === String(
                        correctAnswer
                    )
                ){

                    correct++;

                }

            }
        );


        const score =
            Math.round(
                (
                    correct /
                    questions.length
                ) * 100
            );


        document.getElementById(
            "score"
        ).textContent =
            score + "%";


        document.getElementById(
            "questionArea"
        ).style.display =
            "none";


        document.getElementById(
            "navigation"
        ).style.display =
            "none";


        document.getElementById(
            "result"
        ).classList.add(
            "show"
        );


        /* =========================
           SAVE RESULT
        ========================= */

        let results = [];

        try{

            results =
                JSON.parse(
                    localStorage.getItem(
                        "results"
                    ) || "[]"
                );

        }catch{

            results = [];

        }


        results.push({

            examId:
                exam.id,

            examTitle:
                exam.title || "اختبار",

            score:
                score,

            correct:
                correct,

            total:
                questions.length,

            user:
                localStorage.getItem(
                    "userName"
                ) || "الطالب",

            date:
                new Date().toISOString()

        });


        localStorage.setItem(
            "results",
            JSON.stringify(results)
        );

    }

}


/* ==========================================
   FORMAT TIME
========================================== */

function formatTime(totalSeconds){

    const minutes =
        Math.floor(
            totalSeconds / 60
        );

    const seconds =
        totalSeconds % 60;


    return String(minutes).padStart(2,"0")
        + ":"
        + String(seconds).padStart(2,"0");

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>
