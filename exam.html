<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | الاختبار</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        #020202;

    color:#fff;

    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

.background{

    position:fixed;

    inset:0;

    z-index:-5;

    pointer-events:none;
}

.grid{

    position:absolute;

    inset:0;

    background-image:

        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    mask-image:
        radial-gradient(
            circle,
            black,
            transparent 90%
        );
}

.glow{

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);

    filter:blur(130px);
}

.glow.one{

    top:-220px;
    right:-120px;

}

.glow.two{

    bottom:-250px;
    left:-140px;

}


/* =========================
   HEADER
========================= */

header{

    position:sticky;

    top:0;

    z-index:100;

    padding:
        16px 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        rgba(2,2,2,.82);

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    backdrop-filter:
        blur(18px);
}

.brand{

    display:flex;

    align-items:center;

    gap:10px;
}

.logo{

    width:43px;
    height:43px;

    border-radius:13px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.14);
}

.logo img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.brand-text h2{

    font-size:14px;
}

.brand-text span{

    display:block;

    margin-top:3px;

    color:#555;

    font-size:7px;
}


/* =========================
   TIMER
========================= */

.timer{

    min-width:105px;

    height:42px;

    padding:
        0 12px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    border-radius:12px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:#aaa;

    font-size:10px;

    font-weight:bold;
}

.timer.warning{

    border-color:
        rgba(255,255,255,.25);

    color:#fff;
}

.timer.danger{

    border-color:
        rgba(255,255,255,.45);

    color:#fff;

    animation:
        pulse 1s infinite;
}

@keyframes pulse{

    50%{
        opacity:.5;
    }

}


/* =========================
   CONTAINER
========================= */

.container{

    width:min(
        900px,
        calc(100% - 25px)
    );

    margin:
        30px auto
        70px;
}


/* =========================
   EXAM HEADER
========================= */

.exam-header{

    padding:25px;

    border-radius:22px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    margin-bottom:18px;
}

.exam-label{

    color:#555;

    font-size:8px;

    margin-bottom:8px;
}

.exam-title{

    font-size:
        clamp(
            21px,
            5vw,
            30px
        );

    margin-bottom:8px;
}

.exam-description{

    color:#5e5e5e;

    font-size:9px;

    line-height:1.8;
}


/* =========================
   PROGRESS
========================= */

.progress-box{

    margin-top:20px;
}

.progress-top{

    display:flex;

    justify-content:space-between;

    margin-bottom:8px;

    color:#555;

    font-size:8px;
}

.progress{

    width:100%;

    height:5px;

    border-radius:20px;

    background:
        rgba(255,255,255,.06);

    overflow:hidden;
}

.progress-bar{

    width:0%;

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #777,
            #fff
        );

    transition:.3s;
}


/* =========================
   QUESTION
========================= */

.question-card{

    padding:25px;

    border-radius:22px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.025);

    margin-bottom:15px;
}

.question-number{

    color:#555;

    font-size:8px;

    margin-bottom:12px;
}

.question-text{

    font-size:
        clamp(
            15px,
            3vw,
            20px
        );

    line-height:1.8;

    margin-bottom:22px;
}


/* =========================
   OPTIONS
========================= */

.options{

    display:grid;

    gap:10px;
}

.option{

    position:relative;

    width:100%;

    min-height:55px;

    padding:
        13px 15px;

    display:flex;

    align-items:center;

    gap:12px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.018);

    color:#aaa;

    cursor:pointer;

    transition:.2s;
}

.option:hover{

    border-color:
        rgba(255,255,255,.18);

    color:#fff;
}

.option.selected{

    border-color:
        rgba(255,255,255,.35);

    background:
        rgba(255,255,255,.07);

    color:#fff;
}

.option-letter{

    width:31px;
    height:31px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:
        rgba(255,255,255,.05);

    color:#777;

    font-size:9px;

    font-weight:bold;
}

.option.selected .option-letter{

    background:#fff;

    color:#050505;
}

.option-text{

    font-size:10px;

    line-height:1.7;
}


/* =========================
   NAVIGATION
========================= */

.navigation{

    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:15px;
}

.nav-btn{

    min-width:130px;

    height:43px;

    padding:
        0 15px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.025);

    color:#777;

    cursor:pointer;

    font-size:9px;

    transition:.25s;
}

.nav-btn:hover{

    color:#fff;

    border-color:
        rgba(255,255,255,.18);
}

.nav-btn:disabled{

    opacity:.3;

    cursor:not-allowed;
}

.submit-btn{

    min-width:150px;

    height:43px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #aaa
        );

    color:#050505;

    font-size:9px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.submit-btn:hover{

    transform:
        translateY(-2px);
}


/* =========================
   LOADING
========================= */

.loading{

    padding:80px 20px;

    text-align:center;

    color:#555;

    font-size:9px;
}

.loader{

    width:30px;
    height:30px;

    margin:
        0 auto 15px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.08);

    border-top-color:#aaa;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   ERROR
========================= */

.message{

    padding:60px 20px;

    text-align:center;

    border-radius:20px;

    border:
        1px dashed
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.015);
}

.message-icon{

    font-size:30px;

    opacity:.35;

    margin-bottom:12px;
}

.message h3{

    color:#777;

    font-size:12px;

    margin-bottom:8px;
}

.message p{

    color:#444;

    font-size:8px;

    line-height:1.8;
}


/* =========================
   RESULT
========================= */

.result{

    display:none;

    text-align:center;

    padding:40px 25px;

    border-radius:25px;

    border:
        1px solid
        rgba(255,255,255,.09);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.05),
            rgba(255,255,255,.015)
        );
}

.result.show{

    display:block;

    animation:
        resultIn .5s ease;
}

@keyframes resultIn{

    from{

        opacity:0;

        transform:
            translateY(15px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}

.result-icon{

    font-size:40px;

    margin-bottom:15px;
}

.result h2{

    font-size:22px;

    margin-bottom:8px;
}

.result p{

    color:#555;

    font-size:9px;

    margin-bottom:25px;
}

.score{

    font-size:55px;

    font-weight:bold;

    margin-bottom:5px;
}

.score-label{

    color:#555;

    font-size:8px;

    margin-bottom:25px;
}

.result-btn{

    height:43px;

    padding:
        0 25px;

    border:0;

    border-radius:11px;

    background:#fff;

    color:#050505;

    cursor:pointer;

    font-size:9px;

    font-weight:bold;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{

        padding:
            13px 15px;

    }

    .brand-text{

        display:none;

    }

    .container{

        width:
            calc(100% - 15px);

        margin-top:18px;

    }

    .exam-header,
    .question-card{

        padding:20px;

    }

    .navigation{

        flex-wrap:wrap;

    }

    .nav-btn,
    .submit-btn{

        flex:1;

        min-width:
            calc(50% - 5px);

    }

    .timer{

        min-width:90px;

        font-size:9px;

    }

}

</style>

</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://cuygojzrgpposlcpthjw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ySp8SmV4CDZaOojNnkNMPA_5S5s_Ia5";

const {
    createClient
} = window.supabase;

const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const loading =
    document.getElementById(
        "loading"
    );

const examContent =
    document.getElementById(
        "examContent"
    );

const message =
    document.getElementById(
        "message"
    );

const messageIcon =
    document.getElementById(
        "messageIcon"
    );

const messageTitle =
    document.getElementById(
        "messageTitle"
    );

const messageText =
    document.getElementById(
        "messageText"
    );

const result =
    document.getElementById(
        "result"
    );

const examTitle =
    document.getElementById(
        "examTitle"
    );

const examDescription =
    document.getElementById(
        "examDescription"
    );

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const questionText =
    document.getElementById(
        "questionText"
    );

const options =
    document.getElementById(
        "options"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const previousBtn =
    document.getElementById(
        "previousBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );

const timer =
    document.getElementById(
        "timer"
    );

const timerText =
    document.getElementById(
        "timerText"
    );

const score =
    document.getElementById(
        "score"
    );


/* =========================================
   STATE
========================================= */

let currentUser = null;

let exam = null;

let questions = [];

let currentIndex = 0;

let answers = {};

let timerInterval = null;

let secondsLeft = 0;

let submitted = false;


/* =========================================
   GET EXAM ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const examId =
    params.get("id");


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
    title,
    text,
    icon = "⚠"
){

    loading.style.display =
        "none";

    examContent.style.display =
        "none";

    message.style.display =
        "block";

    messageIcon.textContent =
        icon;

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

}


/* =========================================
   SESSION
========================================= */

async function getUser(){

    const {
        data,
        error
    } =
        await supabase.auth
        .getSession();


    if(error){

        showMessage(
            "تعذر الاتصال",
            "حدث خطأ أثناء التحقق من تسجيل الدخول."
        );

        return null;

    }


    if(
        !data ||
        !data.session
    ){

        window.location.href =
            "auth.html";

        return null;

    }


    return data.session.user;

}


/* =========================================
   LOAD EXAM
========================================= */

async function loadExam(){

    if(!examId){

        showMessage(
            "الاختبار غير موجود",
            "لم يتم تحديد الاختبار المطلوب."
        );

        return;

    }


    const {
        data,
        error
    } =
        await supabase
        .from("exams")
        .select("*")
        .eq(
            "id",
            examId
        )
        .eq(
            "active",
            true
        )
        .maybeSingle();


    if(error){

        console.error(
            error
        );

        showMessage(
            "تعذر تحميل الاختبار",
            "حدث خطأ أثناء جلب بيانات الاختبار."
        );

        return;

    }


    if(!data){

        showMessage(
            "الاختبار غير متاح",
            "هذا الاختبار غير موجود أو لم يعد منشورًا."
        );

        return;

    }


    exam = data;


    examTitle.textContent =
        exam.title ||
        "اختبار";


    examDescription.textContent =
        exam.description ||
        "اختبار إلكتروني من منصة الخوارزمي.";


    await loadQuestions();

}


/* =========================================
   LOAD QUESTIONS
========================================= */

async function loadQuestions(){

    /*
     * الترتيب حسب order_number
     * وإذا لم يكن موجودًا نستخدم created_at
     */

    let query =
        supabase
        .from("questions")
        .select("*")
        .eq(
            "exam_id",
            examId
        );


    const {
        data,
        error
    } =
        await query;


    if(error){

        console.error(
            error
        );

        showMessage(
            "تعذر تحميل الأسئلة",
            "تأكد من أن جدول questions يحتوي على أسئلة لهذا الاختبار."
        );

        return;

    }


    questions =
        data || [];


    /*
     * ترتيب الأسئلة
     */

    questions.sort(
        (
            a,
            b
        ) => {

            const aa =
                Number(
                    a.order_number ??
                    a.question_order ??
                    a.order ??
                    0
                );

            const bb =
                Number(
                    b.order_number ??
                    b.question_order ??
                    b.order ??
                    0
                );

            return aa - bb;

        }
    );


    if(
        questions.length === 0
    ){

        showMessage(
            "لا توجد أسئلة",
            "هذا الاختبار لا يحتوي على أسئلة حاليًا.",
            "📝"
        );

        return;

    }


    loading.style.display =
        "none";

    examContent.style.display =
        "block";


    /*
     * تشغيل المؤقت
     */

    startTimer();


    /*
     * عرض السؤال الأول
     */

    renderQuestion();

}


/* =========================================
   GET QUESTION TEXT
========================================= */

function getQuestionText(
    question
){

    return (
        question.question ||
        question.question_text ||
        question.text ||
        question.title ||
        "السؤال"
    );

}


/* =========================================
   GET OPTIONS
========================================= */

function getOptions(
    question
){

    /*
     * دعم أكثر من شكل محتمل
     */

    if(
        Array.isArray(
            question.options
        )
    ){

        return question.options;

    }


    if(
        typeof question.options ===
        "string"
    ){

        try{

            const parsed =
                JSON.parse(
                    question.options
                );

            if(
                Array.isArray(parsed)
            ){

                return parsed;

            }

        }catch{

            return question.options
                .split("|")
                .map(
                    x => x.trim()
                )
                .filter(Boolean);

        }

    }


    const possible = [

        question.option_a,

        question.option_b,

        question.option_c,

        question.option_d

    ];


    return possible.filter(
        x =>
            x !== null &&
            x !== undefined &&
            String(x).trim() !== ""
    );

}


/* =========================================
   GET CORRECT ANSWER
========================================= */

function getCorrectAnswer(
    question
){

    return (
        question.correct_answer ??
        question.answer ??
        question.correct_option ??
        question.correct
    );

}


/* =========================================
   RENDER QUESTION
========================================= */

function renderQuestion(){

    const question =
        questions[
            currentIndex
        ];


    if(!question){

        return;

    }


    const total =
        questions.length;


    questionNumber.textContent =
        `السؤال ${
            currentIndex + 1
        } من ${total}`;


    questionText.textContent =
        getQuestionText(
            question
        );


    progressText.textContent =
        `${
            currentIndex + 1
        } / ${total}`;


    progressBar.style.width =
        (
            (
                currentIndex + 1
            )
            /
            total
            *
            100
        ) +
        "%";


    const questionOptions =
        getOptions(
            question
        );


    options.innerHTML = "";


    if(
        questionOptions.length === 0
    ){

        options.innerHTML = `

            <div
                style="
                    color:#555;
                    font-size:9px;
                    padding:15px;
                "
            >
                لا توجد اختيارات لهذا السؤال.
            </div>

        `;

    }
    else{

        questionOptions.forEach(
            (
                option,
                index
            ) => {

                const value =
                    String(
                        option
                    );


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "option";


                if(
                    answers[
                        question.id
                    ] === value
                ){

                    div.classList.add(
                        "selected"
                    );

                }


                const letter =
                    String.fromCharCode(
                        65 + index
                    );


                div.innerHTML = `

                    <div
                        class="option-letter"
                    >
                        ${letter}
                    </div>

                    <div
                        class="option-text"
                    >
                        ${escapeHTML(value)}
                    </div>

                `;


                div.addEventListener(
                    "click",
                    () => {

                        selectAnswer(
                            question,
                            value
                        );

                    }
                );


                options.appendChild(
                    div
                );

            }
        );

    }


    previousBtn.disabled =
        currentIndex === 0;


    if(
        currentIndex ===
        questions.length - 1
    ){

        nextBtn.style.display =
            "none";

        submitBtn.style.display =
            "block";

    }
    else{

        nextBtn.style.display =
            "block";

        submitBtn.style.display =
            "none";

    }

}


/* =========================================
   SELECT ANSWER
========================================= */

function selectAnswer(
    question,
    value
){

    answers[
        question.id
    ] = value;


    renderQuestion();

}


/* =========================================
   PREVIOUS
========================================= */

previousBtn.addEventListener(
    "click",
    function(){

        if(
            currentIndex > 0
        ){

            currentIndex--;

            renderQuestion();

            window.scrollTo(
                {
                    top:0,
                    behavior:"smooth"
                }
            );

        }

    }
);


/* =========================================
   NEXT
========================================= */

nextBtn.addEventListener(
    "click",
    function(){

        if(
            currentIndex <
            questions.length - 1
        ){

            currentIndex++;

            renderQuestion();

            window.scrollTo(
                {
                    top:0,
                    behavior:"smooth"
                }
            );

        }

    }
);


/* =========================================
   TIMER
========================================= */

function startTimer(){

    const duration =
        Number(
            exam.duration ??
            exam.time_limit ??
            exam.duration_minutes ??
            0
        );


    /*
     * لا يوجد وقت
     */

    if(
        !duration ||
        duration <= 0
    ){

        timerText.textContent =
            "بدون وقت";

        return;

    }


    secondsLeft =
        duration * 60;


    updateTimer();


    timerInterval =
        setInterval(
            () => {

                secondsLeft--;

                updateTimer();


                if(
                    secondsLeft <= 0
                ){

                    clearInterval(
                        timerInterval
                    );

                    timerInterval =
                        null;

                    submitExam(
                        true
                    );

                }

            },
            1000
        );

}


/* =========================================
   UPDATE TIMER
========================================= */

function updateTimer(){

    const minutes =
        Math.floor(
            secondsLeft / 60
        );

    const seconds =
        secondsLeft % 60;


    timerText.textContent =
        String(minutes)
        .padStart(
            2,
            "0"
        )
        +
        ":" +
        String(seconds)
        .padStart(
            2,
            "0"
        );


    timer.classList.remove(
        "warning",
        "danger"
    );


    if(
        secondsLeft <= 60
    ){

        timer.classList.add(
            "danger"
        );

    }
    else if(
        secondsLeft <= 300
    ){

        timer.classList.add(
            "warning"
        );

    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   SUBMIT
========================================= */

submitBtn.addEventListener(
    "click",
    () => {

        submitExam(
            false
        );

    }
);


/* =========================================
   SUBMIT EXAM
========================================= */

async function submitExam(
    automatic = false
){

    if(submitted){

        return;

    }


    /*
     * تأكيد التسليم اليدوي
     */

    if(!automatic){

        const unanswered =
            questions.filter(
                q =>
                    answers[
                        q.id
                    ] === undefined
            );


        if(
            unanswered.length > 0
        ){

            const confirmSubmit =
                confirm(
                    `لم تجب عن ${
                        unanswered.length
                    } سؤال. هل تريد تسليم الاختبار؟`
                );


            if(!confirmSubmit){

                return;

            }

        }
        else{

            const confirmSubmit =
                confirm(
                    "هل تريد تسليم الاختبار؟"
                );


            if(!confirmSubmit){

                return;

            }

        }

    }


    submitted = true;


    submitBtn.disabled =
        true;

    submitBtn.textContent =
        "جاري التسليم...";


    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }


    /*
     * حساب النتيجة
     */

    let correct = 0;


    questions.forEach(
        question => {

            const userAnswer =
                answers[
                    question.id
                ];


            const correctAnswer =
                getCorrectAnswer(
                    question
                );


            if(
                userAnswer !== undefined &&
                correctAnswer !== undefined &&
                String(
                    userAnswer
                ).trim()
                ===
                String(
                    correctAnswer
                ).trim()
            ){

                correct++;

            }

        }
    );


    const total =
        questions.length;


    const percentage =
        total > 0
        ?
        Math.round(
            (
                correct /
                total
            ) *
            100
        )
        :
        0;


    /*
     * حفظ النتيجة
     */

    const saved =
        await saveResult(
            correct,
            total,
            percentage
        );


    if(!saved){

        submitted = false;

        submitBtn.disabled =
            false;

        submitBtn.textContent =
            "تسليم الاختبار";

        return;

    }


    showResult(
        correct,
        total,
        percentage
    );

}


/* =========================================
   SAVE RESULT
========================================= */

async function saveResult(
    correct,
    total,
    percentage
){

    /*
     * نحاول استخدام الأعمدة الأساسية.
     */

    const payload = {

        user_id:
            currentUser.id,

        exam_id:
            examId,

        score:
            percentage,

        correct_answers:
            correct,

        total_questions:
            total

    };


    const {
        error
    } =
        await supabase
        .from("results")
        .insert(
            payload
        );


    if(error){

        console.error(
            "RESULT ERROR:",
            error
        );


        /*
         * لا نعرض نتيجة محفوظة
         * إذا فشل الحفظ.
         */

        showMessage(
            "تعذر حفظ النتيجة",
            "تم حساب نتيجتك، لكن لم نتمكن من حفظها في قاعدة البيانات. راجع أعمدة جدول results."
        );


        return false;

    }


    /*
     * تحديث أفضل نتيجة في profiles
     */

    await updateBestScore(
        percentage
    );


    return true;

}


/* =========================================
   UPDATE BEST SCORE
========================================= */

async function updateBestScore(
    newScore
){

    /*
     * نقرأ أفضل نتيجة حالية.
     */

    const {
        data:
        profile
    } =
        await supabase
        .from("profiles")
        .select(
            "best_score"
        )
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    const oldScore =
        Number(
            profile?.best_score || 0
        );


    if(
        newScore <= oldScore
    ){

        return;

    }


    await supabase
        .from("profiles")
        .update(
            {
                best_score:
                    newScore
            }
        )
        .eq(
            "id",
            currentUser.id
        );

}


/* =========================================
   SHOW RESULT
========================================= */

function showResult(
    correct,
    total,
    percentage
){

    examContent.style.display =
        "none";

    message.style.display =
        "none";

    result.classList.add(
        "show"
    );


    score.textContent =
        percentage +
        "%";


    document.title =
        "الخوارزمي | النتيجة";


    window.scrollTo(
        {
            top:0,
            behavior:"smooth"
        }
    );

}
