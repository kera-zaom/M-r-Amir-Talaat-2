<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | دخول الإدارة</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.08),
            transparent 32%
        ),
        #020202;

    overflow:hidden;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    z-index:-5;
}

.grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );

    background-size:55px 55px;
}

.glow{
    position:absolute;

    width:430px;
    height:430px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);

    filter:blur(120px);
}

.glow.one{
    top:-230px;
    right:-180px;
}

.glow.two{
    bottom:-250px;
    left:-180px;
}

/* =========================
   LOGIN CARD
========================= */

.login-card{

    width:min(
        430px,
        calc(100% - 30px)
    );

    padding:35px 30px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.6);

    backdrop-filter:blur(25px);

    animation:
        cardShow .7s ease;
}

@keyframes cardShow{

    from{
        opacity:0;
        transform:
            translateY(20px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

/* =========================
   LOGO
========================= */

.logo-area{
    text-align:center;

    margin-bottom:30px;
}

.logo{

    width:82px;
    height:82px;

    margin:0 auto 17px;

    overflow:hidden;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #777
        );

    box-shadow:
        0 15px 45px
        rgba(255,255,255,.08);

    animation:
        logoFloat 3.5s ease-in-out infinite;
}

.logo img{
    width:100%;
    height:100%;

    object-fit:cover;
}

@keyframes logoFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0);
    }

    50%{
        transform:
            translateY(-6px)
            rotate(2deg);
    }

}

.logo-area h1{

    font-size:25px;

    margin-bottom:8px;

}

.logo-area h1 span{

    background:
        linear-gradient(
            90deg,
            white,
            #777
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

}

.logo-area p{

    color:#555;

    font-size:10px;

    line-height:1.8;

}

/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:17px;

}

.form-group label{

    display:block;

    color:#888;

    font-size:10px;

    margin-bottom:8px;

}

.input-wrap{

    position:relative;

}

.input-icon{

    position:absolute;

    right:13px;

    top:50%;

    transform:
        translateY(-50%);

    color:#555;

    font-size:13px;

    pointer-events:none;

}

input{

    width:100%;

    height:48px;

    padding:
        0 40px 0 13px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    color:white;

    background:
        rgba(0,0,0,.28);

    font-size:11px;

    transition:.3s;

}

input::placeholder{

    color:#444;

}

input:focus{

    border-color:
        rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.035);

}

/* =========================
   LOGIN BUTTON
========================= */

.login-btn{

    width:100%;

    height:49px;

    margin-top:8px;

    border:none;

    border-radius:13px;

    cursor:pointer;

    color:#050505;

    background:
        linear-gradient(
            135deg,
            #fff,
            #aaa
        );

    font-size:11px;

    font-weight:bold;

    transition:.3s;

}

.login-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 40px
        rgba(255,255,255,.1);

}

.login-btn:active{

    transform:
        scale(.98);

}

/* =========================
   ERROR
========================= */

.error{

    display:none;

    margin-top:14px;

    padding:11px;

    border-radius:11px;

    text-align:center;

    color:#aaa;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.07);

    font-size:9px;

}

.error.show{

    display:block;

    animation:
        shake .35s ease;

}

@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-5px);
    }

    75%{
        transform:translateX(5px);
    }

}

/* =========================
   FOOTER
========================= */

.footer{

    margin-top:25px;

    padding-top:18px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    text-align:center;

}

.footer a{

    color:#666;

    text-decoration:none;

    font-size:9px;

    transition:.3s;

}

.footer a:hover{

    color:white;

}

.footer p{

    color:#333;

    font-size:8px;

    margin-top:10px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .login-card{

        padding:
            30px 20px;

        border-radius:23px;

    }

    .logo{

        width:70px;
        height:70px;

        border-radius:21px;

    }

    .logo-area h1{

        font-size:22px;

    }

}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

    <div class="grid"></div>

</div>


<!-- =========================
     LOGIN
========================= -->

<main class="login-card">


    <div class="logo-area">

        <div class="logo">

            <img
                src="../teacher.png"
                alt="الخوارزمي"
            >

        </div>

        <h1>
            الخوارزمي
            <span>
                | الإدارة
            </span>
        </h1>

        <p>
            تسجيل الدخول إلى لوحة إدارة المنصة
        </p>

    </div>


    <form
        id="loginForm"
        autocomplete="off"
    >


        <div class="form-group">

            <label for="email">
                البريد الإلكتروني
            </label>

            <div class="input-wrap">

                <span class="input-icon">
                    @
                </span>

                <input
                    type="email"
                    id="email"
                    placeholder="أدخل البريد الإلكتروني"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="password">
                كلمة المرور
            </label>

            <div class="input-wrap">

                <span class="input-icon">
                    •
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            class="login-btn"
        >
            دخول لوحة الإدارة
        </button>


        <div
            class="error"
            id="error"
        >
            البريد الإلكتروني أو كلمة المرور غير صحيحة.
        </div>


    </form>


    <div class="footer">

        <a href="../index.html">
            ← العودة إلى المنصة
        </a>

        <p>
            © 2026 الخوارزمي | منصة الاختبارات
        </p>

    </div>


</main>


<script>

/*
==========================================
مهم:
ده نظام Front-End تجريبي فقط.

بيانات الدخول الافتراضية:
البريد:
admin@alkhwarizmi.com

كلمة المرور:
admin123

في النسخة النهائية يفضل ربط الدخول
بـ Backend وقاعدة بيانات.
==========================================
*/


const form =
    document.getElementById(
        "loginForm"
    );

const error =
    document.getElementById(
        "error"
    );


form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        /*
        ================================
        ADMIN LOGIN
        ================================
        */

        const correctEmail =
            "admin@alkhwarizmi.com";

        const correctPassword =
            "admin123";


        if(
            email === correctEmail &&
            password === correctPassword
        ){

            /*
            حفظ حالة الأدمن
            */

            localStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            localStorage.setItem(
                "adminName",
                "المسؤول"
            );


            /*
            الانتقال للوحة الإدارة
            */

            window.location.href =
                "index.html";

        }

        else{

            error.classList.add(
                "show"
            );


            setTimeout(
                function(){

                    error.classList.remove(
                        "show"
                    );

                },
                3000
            );

        }

    }
);

</script>


</body>

</html>
