<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>الخوارزمي | دخول الإدارة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.09),
            transparent 35%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(255,255,255,.04),
            transparent 30%
        ),
        #020202;

    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}


/* الخلفية */

.background{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    mask-image:
        radial-gradient(
            circle,
            black,
            transparent 90%
        );
}

.orb{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(255,255,255,.035);
    filter:blur(110px);
}

.orb.one{
    top:-250px;
    right:-160px;
}

.orb.two{
    bottom:-260px;
    left:-170px;
}


/* الحاوية */

.container{
    width:min(430px,92%);
    position:relative;
    z-index:2;
}


/* اللوجو */

.logo-area{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:72px;
    height:72px;

    margin:auto;

    border-radius:20px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        linear-gradient(
            145deg,
            #fff,
            #777
        );

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.6);

    animation:
        floating 4s ease-in-out infinite;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes floating{

    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-7px) rotate(2deg);
    }
}

.logo-area h1{
    margin-top:15px;
    font-size:22px;
}

.logo-area p{
    color:#4d4d4d;
    font-size:8px;
    margin-top:7px;
}


/* الكارت */

.card{

    padding:30px;

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);

    backdrop-filter:blur(25px);
}

.card-title{
    margin-bottom:23px;
}

.card-title h2{
    font-size:14px;
    margin-bottom:7px;
}

.card-title p{
    color:#505050;
    font-size:8px;
}


/* الحقول */

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:#777;
    font-size:8px;
    margin-bottom:7px;
}

.input-box{
    position:relative;
}

.input-box input{

    width:100%;
    height:48px;

    padding:
        0 14px;

    border-radius:12px;

    outline:none;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(0,0,0,.45);

    color:#fff;

    font-size:9px;

    transition:.25s;
}

.input-box input::placeholder{
    color:#353535;
}

.input-box input:focus{

    border-color:
        rgba(255,255,255,.2);

    background:
        rgba(255,255,255,.025);

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.025);
}


/* كلمة المرور */

.password-toggle{

    position:absolute;

    left:12px;
    top:50%;

    transform:
        translateY(-50%);

    border:0;

    background:none;

    color:#555;

    cursor:pointer;

    font-size:11px;
}


/* تذكرني */

.options{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin:
        4px 0 19px;
}

.remember{
    display:flex;
    align-items:center;
    gap:6px;

    color:#555;
    font-size:7px;
}

.remember input{
    accent-color:#fff;
}


/* الزر */

.login-btn{

    width:100%;
    height:49px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #aaa
        );

    color:#050505;

    font-weight:bold;

    font-size:9px;

    cursor:pointer;

    transition:.25s;
}

.login-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(255,255,255,.08);
}

.login-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}


/* رسالة الخطأ */

.message{

    display:none;

    margin-top:13px;

    padding:11px;

    border-radius:10px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.06);

    color:#777;

    text-align:center;

    font-size:7px;

    line-height:1.8;
}

.message.show{
    display:block;
}


/* رجوع */

.back{

    display:block;

    text-align:center;

    margin-top:18px;

    color:#444;

    font-size:7px;

    text-decoration:none;

    transition:.2s;
}

.back:hover{
    color:#aaa;
}


/* الفوتر */

.footer{

    text-align:center;

    margin-top:22px;

    color:#292929;

    font-size:6px;
}


/* موبايل */

@media(max-width:500px){

    .card{
        padding:22px;
    }

    .logo{
        width:62px;
        height:62px;
    }

    .logo-area h1{
        font-size:19px;
    }

}

</style>

</head>


<body>


<div class="background">

    <div class="grid"></div>

    <div class="orb one"></div>

    <div class="orb two"></div>

</div>


<div class="container">


    <div class="logo-area">

        <div class="logo">

            <img
                src="../teacher.png"
                alt="الخوارزمي"
            >

        </div>

        <h1>
            الخوارزمي
        </h1>

        <p>
            منصة الاختبارات الإلكترونية
        </p>

    </div>


    <div class="card">


        <div class="card-title">

            <h2>
                تسجيل دخول الإدارة
            </h2>

            <p>
                أدخل بيانات حساب المسؤول للمتابعة
            </p>

        </div>


        <form id="loginForm">


            <div class="field">

                <label>
                    البريد الإلكتروني
                </label>

                <div class="input-box">

                    <input
                        id="email"
                        type="email"
                        placeholder="admin@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <div class="field">

                <label>
                    كلمة المرور
                </label>

                <div class="input-box">

                    <input
                        id="password"
                        type="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="إظهار كلمة المرور"
                    >
                        ◉
                    </button>

                </div>

            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    تذكرني

                </label>

            </div>


            <button
                id="loginBtn"
                class="login-btn"
                type="submit"
            >
                دخول لوحة الإدارة
            </button>


            <div
                id="message"
                class="message"
            ></div>


        </form>


        <a
            href="../index.html"
            class="back"
        >
            ← العودة إلى المنصة
        </a>


    </div>


    <div class="footer">
        الخوارزمي © 2026
    </div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://cuygojzrgpposlcpthjw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ySp8SmV4CDZaOojNnkNMPA_5S5s_Ia5";

const {
    createClient
} = window.supabase;

const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const message =
    document.getElementById(
        "message"
    );

const togglePassword =
    document.getElementById(
        "togglePassword"
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text
){

    message.textContent =
        text;

    message.classList.add(
        "show"
    );

}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage(){

    message.textContent =
        "";

    message.classList.remove(
        "show"
    );

}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

togglePassword.addEventListener(
    "click",
    () => {

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "◌";

        }else{

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "◉";

        }

    }
);


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkSession(){

    const {
        data
    } =
        await supabase.auth
        .getSession();


    if(
        data &&
        data.session
    ){

        window.location.href =
            "index.html";

    }

}

checkSession();


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        hideMessage();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(
            !email ||
            !password
        ){

            showMessage(
                "من فضلك أدخل البريد الإلكتروني وكلمة المرور."
            );

            return;

        }


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "جاري تسجيل الدخول...";


        const {
            data,
            error
        } =
            await supabase.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            console.error(
                error
            );

            let text =
                "تعذر تسجيل الدخول.";

            if(
                error.message
                .toLowerCase()
                .includes("invalid login")
            ){

                text =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }

            if(
                error.message
                .toLowerCase()
                .includes("email not confirmed")
            ){

                text =
                    "يجب تأكيد البريد الإلكتروني أولًا.";

            }

            showMessage(
                text
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "دخول لوحة الإدارة";

            return;

        }


        if(
            data &&
            data.session
        ){

            loginBtn.textContent =
                "تم تسجيل الدخول ✓";


            /*
             * بعد نجاح الدخول
             * ننتقل للوحة الإدارة
             */

            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                500
            );

        }else{

            showMessage(
                "لم يتم إنشاء جلسة دخول."
            );

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "دخول لوحة الإدارة";

        }

    }
);

</script>

</body>

</html>
