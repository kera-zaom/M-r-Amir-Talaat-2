<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | الرئيسية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

body{

    min-height:100vh;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        #020202;

    overflow-x:hidden;
}


/* ================================
   BACKGROUND
================================ */

.background{

    position:fixed;
    inset:0;

    z-index:-5;

    pointer-events:none;
}

.grid{

    position:absolute;
    inset:0;

    background-image:

        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    mask-image:
        radial-gradient(
            circle,
            black,
            transparent 90%
        );
}

.glow{

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);

    filter:blur(130px);

}

.glow.one{

    top:-220px;
    right:-120px;

}

.glow.two{

    bottom:-250px;
    left:-140px;

}


/* ================================
   HEADER
================================ */

header{

    width:100%;

    padding:
        18px
        5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    background:
        rgba(2,2,2,.75);

    backdrop-filter:
        blur(18px);

    position:sticky;

    top:0;

    z-index:100;

}

.brand{

    display:flex;

    align-items:center;

    gap:10px;

}

.brand-logo{

    width:43px;
    height:43px;

    border-radius:13px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #fff,
            #777
        );

    border:
        1px solid
        rgba(255,255,255,.15);

}

.brand-logo img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.brand-text h2{

    font-size:14px;

}

.brand-text span{

    display:block;

    margin-top:3px;

    color:#555;

    font-size:7px;

}

.header-actions{

    display:flex;

    align-items:center;

    gap:8px;

}

.header-btn{

    height:37px;

    padding:
        0 13px;

    border-radius:10px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.025);

    color:#888;

    font-size:8px;

    cursor:pointer;

    transition:.25s;

}

.header-btn:hover{

    color:#fff;

    border-color:
        rgba(255,255,255,.18);

}

.logout{

    color:#666;

}


/* ================================
   CONTAINER
================================ */

.container{

    width:min(
        1180px,
        calc(100% - 30px)
    );

    margin:
        35px auto
        60px;

}


/* ================================
   WELCOME
================================ */

.welcome{

    position:relative;

    padding:
        30px;

    border-radius:25px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    overflow:hidden;

    margin-bottom:20px;

}

.welcome::after{

    content:"";

    position:absolute;

    width:250px;
    height:250px;

    border-radius:50%;

    left:-100px;
    bottom:-170px;

    background:
        rgba(255,255,255,.025);

    filter:blur(70px);

}

.welcome-small{

    color:#555;

    font-size:9px;

    margin-bottom:8px;

}

.welcome h1{

    font-size:
        clamp(
            23px,
            5vw,
            34px
        );

    margin-bottom:9px;

}

.welcome h1 span{

    color:#aaa;

}

.welcome p{

    color:#666;

    font-size:10px;

}


/* ================================
   STATS
================================ */

.stats{

    display:grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap:14px;

    margin-bottom:30px;

}

.stat{

    padding:22px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.025);

    transition:.25s;

}

.stat:hover{

    transform:
        translateY(-3px);

    border-color:
        rgba(255,255,255,.13);

}

.stat-title{

    color:#555;

    font-size:8px;

    margin-bottom:12px;

}

.stat-value{

    font-size:25px;

    font-weight:bold;

    color:#ddd;

}


/* ================================
   SECTION TITLE
================================ */

.section-head{

    display:flex;

    align-items:end;

    justify-content:space-between;

    margin-bottom:15px;

}

.section-head h2{

    font-size:16px;

}

.section-head span{

    color:#4e4e4e;

    font-size:8px;

}


/* ================================
   EXAMS
================================ */

.exams{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                250px,
                1fr
            )
        );

    gap:15px;

}

.exam-card{

    padding:20px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );

    transition:
        .25s ease;

}

.exam-card:hover{

    transform:
        translateY(-4px);

    border-color:
        rgba(255,255,255,.14);

}

.exam-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:17px;

}

.exam-icon{

    width:43px;
    height:43px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.07);

    font-size:17px;

}

.exam-status{

    padding:
        6px 9px;

    border-radius:8px;

    color:#888;

    background:
        rgba(255,255,255,.035);

    font-size:7px;

}

.exam-card h3{

    font-size:13px;

    margin-bottom:8px;

}

.exam-description{

    min-height:32px;

    color:#555;

    font-size:8px;

    line-height:1.7;

    margin-bottom:17px;

}

.exam-info{

    display:flex;

    gap:7px;

    flex-wrap:wrap;

    margin-bottom:17px;

}

.info{

    padding:
        6px 8px;

    border-radius:8px;

    color:#666;

    background:
        rgba(255,255,255,.025);

    font-size:7px;

}

.start-btn{

    width:100%;

    height:40px;

    border:0;

    border-radius:11px;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #fff,
            #aaa
        );

    color:#080808;

    font-size:9px;

    font-weight:bold;

    transition:.25s;

}

.start-btn:hover{

    transform:
        translateY(-2px);

}


/* ================================
   EMPTY
================================ */

.empty{

    padding:55px 20px;

    text-align:center;

    border-radius:20px;

    border:
        1px dashed
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.015);

}

.empty-icon{

    font-size:30px;

    opacity:.3;

    margin-bottom:13px;

}

.empty h3{

    font-size:12px;

    color:#777;

    margin-bottom:7px;

}

.empty p{

    font-size:8px;

    color:#444;

}


/* ================================
   LOADING
================================ */

.loading{

    padding:50px;

    text-align:center;

    color:#555;

    font-size:9px;

}

.loader{

    width:25px;
    height:25px;

    margin:
        0 auto 12px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.08);

    border-top-color:
        #aaa;

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:
            rotate(360deg);
    }

}


/* ================================
   TOAST
================================ */

.toast{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:
        translateX(-50%)
        translateY(100px);

    padding:
        12px 18px;

    border-radius:12px;

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.1);

    color:#aaa;

    font-size:8px;

    opacity:0;

    transition:.3s;

    z-index:999;

}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);

}


/* ================================
   MOBILE
================================ */

@media(max-width:700px){

    header{

        padding:
            14px 15px;

    }

    .header-btn{

        padding:
            0 10px;

    }

    .header-btn.tests{

        display:none;

    }

    .container{

        width:
            calc(100% - 20px);

        margin-top:20px;

    }

    .welcome{

        padding:23px;

    }

    .stats{

        grid-template-columns:
            1fr 1fr;

    }

    .stat:last-child{

        grid-column:
            span 2;

    }

}

@media(max-width:420px){

    .brand-text{

        display:none;

    }

    .stats{

        grid-template-columns:
            1fr;

    }

    .stat:last-child{

        grid-column:
            span 1;

    }

}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="background">

    <div class="grid"></div>

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>


<!-- HEADER -->

<header>


    <div class="brand">

        <div class="brand-logo">

            <img
                src="teacher.png"
                alt="الخوارزمي"
            >

        </div>


        <div class="brand-text">

            <h2>
                الخوارزمي
            </h2>

            <span>
                منصة الاختبارات
            </span>

        </div>

    </div>


    <div class="header-actions">

        <button
            class="header-btn tests"
            onclick="
                window.location.href='tests.html'
            "
        >
            الاختبارات
        </button>


        <button
            class="header-btn logout"
            id="logoutBtn"
        >
            تسجيل الخروج
        </button>

    </div>


</header>


<!-- MAIN -->

<main class="container">


    <!-- WELCOME -->

    <section class="welcome">

        <div class="welcome-small">
            لوحة الطالب
        </div>

        <h1>
            أهلاً بك،
            <span id="studentName">
                الطالب
            </span>
        </h1>

        <p>
            اختر اختبارك وابدأ التحدي.
        </p>

    </section>


    <!-- STATS -->

    <section class="stats">


        <div class="stat">

            <div class="stat-title">
                أفضل نتيجة
            </div>

            <div
                class="stat-value"
                id="bestScore"
            >
                —
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                الاختبارات المتاحة
            </div>

            <div
                class="stat-value"
                id="availableExams"
            >
                —
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                الاختبارات التي حللتها
            </div>

            <div
                class="stat-value"
                id="completedExams"
            >
                —
            </div>

        </div>


    </section>


    <!-- EXAMS -->

    <section>


        <div class="section-head">

            <h2>
                الاختبارات المتاحة
            </h2>

            <span>
                اختبارات منشورة
            </span>

        </div>


        <div
            id="examsContainer"
            class="exams"
        >

            <div class="loading">

                <div class="loader"></div>

                جاري تحميل الاختبارات...

            </div>

        </div>


    </section>


</main>


<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://cuygojzrgpposlcpthjw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ySp8SmV4CDZaOojNnkNMPA_5S5s_Ia5";


const {
    createClient
} = window.supabase;


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const studentName =
    document.getElementById(
        "studentName"
    );

const bestScore =
    document.getElementById(
        "bestScore"
    );

const availableExams =
    document.getElementById(
        "availableExams"
    );

const completedExams =
    document.getElementById(
        "completedExams"
    );

const examsContainer =
    document.getElementById(
        "examsContainer"
    );

const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );


/* =========================================
   TOAST
========================================= */

function showToast(
    text
){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(
    value
){

    if(!value){

        return "";

    }


    try{

        return new Date(
            value
        ).toLocaleDateString(
            "ar-EG",
            {
                year:"numeric",
                month:"short",
                day:"numeric"
            }
        );

    }catch{

        return "";

    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   LOAD USER
========================================= */

async function loadUser(){

    const {
        data:
        sessionData,
        error:
        sessionError
    } =
        await supabase.auth
        .getSession();


    if(sessionError){

        console.error(
            sessionError
        );

        window.location.href =
            "auth.html";

        return;

    }


    const session =
        sessionData?.session;


    /*
     * لا يوجد تسجيل دخول
     */

    if(!session){

        window.location.href =
            "auth.html";

        return;

    }


    const user =
        session.user;


    /*
     * جلب بيانات الطالب
     */

    const {
        data:
        profile,
        error:
        profileError
    } =
        await supabase
        .from("profiles")
        .select(
            "name,email,role,active,best_score"
        )
        .eq(
            "id",
            user.id
        )
        .maybeSingle();


    if(profileError){

        console.error(
            profileError
        );

    }


    /*
     * لو الحساب غير نشط
     */

    if(
        profile &&
        profile.active === false
    ){

        await supabase.auth
            .signOut();

        window.location.href =
            "auth.html";

        return;

    }


    /*
     * لو الأدمن دخل home
     */

    if(
        profile &&
        profile.role ===
        "admin"
    ){

        window.location.href =
            "admin/index.html";

        return;

    }


    /*
     * عرض الاسم
     */

    if(profile?.name){

        studentName.textContent =
            profile.name;

    }
    else if(
        user.user_metadata?.name
    ){

        studentName.textContent =
            user.user_metadata.name;

    }
    else{

        studentName.textContent =
            "الطالب";

    }


    /*
     * أفضل نتيجة
     */

    if(
        profile &&
        profile.best_score !== null &&
        profile.best_score !== undefined
    ){

        bestScore.textContent =
            profile.best_score;

    }
    else{

        bestScore.textContent =
            "—";

    }


    /*
     * تحميل باقي البيانات
     */

    await loadExams(
        user.id
    );

    await loadCompleted(
        user.id
    );

}


/* =========================================
   LOAD EXAMS
========================================= */

async function loadExams(
    userId
){

    const {
        data:
        exams,
        error
    } =
        await supabase
        .from("exams")
        .select(
            "*"
        )
        .eq(
            "active",
            true
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            error
        );

        examsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠
                </div>

                <h3>
                    تعذر تحميل الاختبارات
                </h3>

                <p>
                    تأكد من اتصال قاعدة البيانات.
                </p>

            </div>

        `;

        return;

    }


    const examList =
        exams || [];


    availableExams.textContent =
        examList.length;


    if(
        examList.length === 0
    ){

        examsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ◌
                </div>

                <h3>
                    لا توجد اختبارات حاليًا
                </h3>

                <p>
                    سيتم ظهور الاختبارات هنا عند نشرها.
                </p>

            </div>

        `;

        return;

    }


    examsContainer.innerHTML =
        examList
        .map(
            exam => createExamCard(
                exam
            )
        )
        .join("");


}


/* =========================================
   CREATE EXAM CARD
========================================= */

function createExamCard(
    exam
){

    const title =
        escapeHTML(
            exam.title ||
            "اختبار"
        );


    const description =
        escapeHTML(
            exam.description ||
            "اختبار إلكتروني من منصة الخوارزمي."
        );


    const duration =
        exam.duration ||
        exam.time_limit ||
        0;


    const questionsCount =
        exam.questions_count ||
        exam.question_count ||
        "—";


    const date =
        formatDate(
            exam.created_at
        );


    return `

        <article
            class="exam-card"
        >

            <div
                class="exam-top"
            >

                <div
                    class="exam-icon"
                >
                    📝
                </div>

                <div
                    class="exam-status"
                >
                    متاح الآن
                </div>

            </div>


            <h3>
                ${title}
            </h3>


            <div
                class="exam-description"
            >
                ${description}
            </div>


            <div
                class="exam-info"
            >

                <div
                    class="info"
                >
                    ⏱
                    ${
                        duration
                        ? duration + " دقيقة"
                        : "الوقت مفتوح"
                    }
                </div>


                <div
                    class="info"
                >
                    ❓
                    ${
                        questionsCount
                        + " سؤال"
                    }
                </div>


                ${
                    date
                    ?
                    `
                    <div
                        class="info"
                    >
                        📅
                        ${date}
                    </div>
                    `
                    :
                    ""
                }

            </div>


            <button
                class="start-btn"
                onclick="
                    startExam(
                        '${exam.id}'
                    )
                "
            >
                بدء الاختبار
            </button>

        </article>

    `;

}


/* =========================================
   START EXAM
========================================= */

function startExam(
    examId
){

    if(!examId){

        showToast(
            "تعذر فتح الاختبار."
        );

        return;

    }


    /*
     * إرسال ID الاختبار
     * إلى exam.html
     */

    window.location.href =
        "exam.html?id=" +
        encodeURIComponent(
            examId
        );

}


/* =========================================
   LOAD COMPLETED EXAMS
========================================= */

async function loadCompleted(
    userId
){

    const {
        data:
        results,
        error
    } =
        await supabase
        .from("results")
        .select(
            "id"
        )
        .eq(
            "user_id",
            userId
        );


    if(error){

        console.warn(
            error
        );

        completedExams.textContent =
            "0";

        return;

    }


    completedExams.textContent =
        (results || []).length;

}


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        logoutBtn.disabled =
            true;

        logoutBtn.textContent =
            "جاري الخروج...";


        const {
            error
        } =
            await supabase.auth
            .signOut();


        if(error){

            console.error(
                error
            );

            showToast(
                "حدث خطأ أثناء تسجيل الخروج."
            );

            logoutBtn.disabled =
                false;

            logoutBtn.textContent =
                "تسجيل الخروج";

            return;

        }


        window.location.href =
            "auth.html";

    }
);


/* =========================================
   AUTH STATE
========================================= */

supabase.auth.onAuthStateChange(
    (
        event,
        session
    ) => {

        if(
            event ===
            "SIGNED_OUT"
        ){

            window.location.href =
                "auth.html";

        }

    }
);


/* =========================================
   START
========================================= */

loadUser();

</script>

</body>

</html>
